[project]
name = "repo2ree-telemetry"
version = "0.1.0"
dependencies = [
    "repo2ree-protocol",
    "requests~=2.34",
    "opentelemetry-sdk~=1.45",
    "opentelemetry-exporter-otlp-proto-http~=1.45",
    "opentelemetry-instrumentation-logging~=0.66b1",
]

[dependency-groups]
dev = [
    "types-requests~=2.33",
]

[tool.uv.sources]
repo2ree-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_telemetry"]
