[project]
name = "repo2ree-provider-docker"
version = "0.1.0"
dependencies = [
    "anyio~=4.12",
    "repo2ree-docker-support",
    "repo2ree-protocol",
    "websockets~=15.0",
]

[project.scripts]
repo2ree-provider-docker = "repo2ree_provider_docker.app:main"

[tool.uv.sources]
repo2ree-docker-support = { workspace = true }
repo2ree-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_provider_docker"]
