# Docker provider service — a deliberately separate stack from the control
# plane. It holds the Docker socket, provisions isolated environments, and
# starts a resident outbound-only workbench inside each allocation.
#
#   docker compose -f docker-compose.workbench.yml up -d      # start
#   docker compose -f docker-compose.workbench.yml down       # stop
#   docker compose -f docker-compose.workbench.yml down -v    # also drop workbench state
#
# Defaults dial a control plane on the same host (host-published :8000).
# Point it at a different backend by overriding PROVIDER_API_WS_URL and
# PROVIDER_WORKBENCH_API_WS_URL.
name: repo2ree-provider

services:
  provider:
    image: ${REPO2REE_PROVIDER_IMAGE:-docker.io/vuducanh1112/repo2ree-provider-docker:edge}
    container_name: ${REPO2REE_PROVIDER_CONTAINER:-repo2ree-provider-docker}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - repo2ree-provider-state:/var/lib/repo2ree-provider
    environment:
      PROVIDER_API_WS_URL: ${PROVIDER_API_WS_URL:-ws://host.docker.internal:8000/provider/connect}
      PROVIDER_WORKBENCH_API_WS_URL: ${PROVIDER_WORKBENCH_API_WS_URL:-ws://host.docker.internal:8000/workbench/connect}
      # Optional network for provider-created workbenches. Set this when the
      # control plane is reachable by service DNS on a shared Docker network.
      PROVIDER_WORKBENCH_DOCKER_NETWORK: ${PROVIDER_WORKBENCH_DOCKER_NETWORK:-}
      PROVIDER_DOCKER_MODE: ${PROVIDER_DOCKER_MODE:-dind}
      # Optional OTLP collector for *this provider's* own logs. Headers (e.g.
      # ClickStack's ingestion API key) ride the standard OTLP env var alongside
      # it. This endpoint is never handed to the benches this provider starts:
      # it is reachable from here, and a bench on an isolated network would
      # retry an address it cannot route to.
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      # What benches do with their own spans: relay (default) sends them over
      # the control-plane socket each bench already holds, as executor spans
      # travel; direct posts to PROVIDER_WORKBENCH_OTLP_ENDPOINT, a collector
      # the benches themselves can reach; local writes TRACE_FILE or stdout
      # inside the bench; off disables bench tracing entirely.
      PROVIDER_WORKBENCH_TELEMETRY: ${PROVIDER_WORKBENCH_TELEMETRY:-}
      PROVIDER_WORKBENCH_OTLP_ENDPOINT: ${PROVIDER_WORKBENCH_OTLP_ENDPOINT:-}

volumes:
  repo2ree-provider-state:
    name: ${REPO2REE_PROVIDER_STATE_VOLUME:-repo2ree-provider-state}
