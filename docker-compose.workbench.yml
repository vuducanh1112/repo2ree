# A store's workbench against a remote repo2ree service — a deliberately separate
# stack from the control plane. It serves one store on this machine and runs each
# REE's scripts in a container from the image the REE declares, through this
# host's Docker socket.
#
# Register the store on the service host and mint its workbench's token there:
#
#   python -m repo2ree_api.store_admin add lab-a --label "Lab A"
#   python -m repo2ree_api.store_admin token lab-a       # prints the token once
#
# Then, here:
#
#   REPO2REE_STORE_ID=lab-a WORKBENCH_AUTH_TOKEN=<token> \
#   REPO2REE_API_WS_URL=wss://repo2ree.example/workbench/connect \
#     docker compose -f docker-compose.workbench.yml up -d          # start
#   docker compose -f docker-compose.workbench.yml down             # stop
#
# The store lives at the same path on this host and in the workbench
# (REPO2REE_STORE_DIR), so a job container the host engine starts sees the REE
# where the workbench does. Its REEs stay there when the workbench stops.
name: repo2ree-workbench

services:
  workbench:
    image: ${REPO2REE_WORKBENCH_IMAGE:-docker.io/vuducanh1112/repo2ree-workbench:edge}
    container_name: ${REPO2REE_WORKBENCH_CONTAINER:-repo2ree-workbench}
    command:
      - repo2ree-workbench
      - --store
      - ${REPO2REE_STORE_ID:-lab}=${REPO2REE_STORE_DIR:-/var/lib/repo2ree/store}
      - --backend
      - container
      - --connect
      - ${REPO2REE_API_WS_URL:-ws://host.docker.internal:8000/workbench/connect}
      # The images an REE created in the store may declare, the first the default.
      - --image
      - ${REPO2REE_STORE_IMAGE:-docker.io/library/python:3.12-slim}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO2REE_STORE_DIR:-/var/lib/repo2ree/store}:${REPO2REE_STORE_DIR:-/var/lib/repo2ree/store}
      - repo2ree-workbench-state:/var/lib/repo2ree-workbench
    environment:
      # The store's token, from store_admin on the service host.
      WORKBENCH_AUTH_TOKEN: ${WORKBENCH_AUTH_TOKEN:?the store's token, from store_admin on the service host}
      # Optional OTLP collector for this workbench's own logs and spans.
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}

volumes:
  repo2ree-workbench-state:
    name: ${REPO2REE_WORKBENCH_STATE_VOLUME:-repo2ree-workbench-state}
