# The dispatch exchange's rules: which records of it and of the receiver's entity
# name each other. Its messages and facts are declared in vocabulary/dispatch.toml.

name = "dispatch"

# The two sides' records name each other, so their order across the journal and
# Git is evidenced rather than assumed: a record that names another can only have
# been written after it existed. The attempt names the journal record of the
# request that dispatched it; the result names the commit that captured the attempt.
[[cites]]
by = { entity = "Attempt", reached = "pending", fact = "dispatched_by" }
cited = { message = "exec_action" }

[[cites]]
by = { message = "result", fact = "commit" }
cited = { entity = "Attempt", reached = "captured", fact = "commit" }
