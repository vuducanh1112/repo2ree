# Typed command dispatch from the supervisor to a workbench.
#
# Recorded on the sender's side: the supervisor journals each request before it
# is sent and the one outcome it observed. The workbench side is not journaled
# yet; the Attempt machine is the receiver's evidence.

name = "dispatch"
sender = "supervisor"
receiver = "workbench"
key = "attempt_id"
partition = "ree_id"
summary = "One typed command sent to a workbench and the single outcome the sender observed."
request = "exec_action"
responses = ["result", "unavailable", "error"]

[messages]
exec_action = "The command envelope, sent over the workbench's connection."
result = "The executor's terminal ActionResult frame."
unavailable = "The workbench reported that it cannot run commands."
error = "The workbench reported a transport or protocol error."

[facts.exec_action]
operation = "str"
run_id = "str"

[facts.result]
status = "str"
# The commit that captured the attempt, as the result reported it.
commit = "str?"

# The two sides' records name each other, so their order across the journal and
# Git is evidenced rather than assumed: a record that names another can only have
# been written after it existed. The attempt names the journal record of the
# request that dispatched it; the result names the commit that captured the attempt.
[[cites]]
by = { entity = "Attempt", reached = "pending", fact = "dispatched_by" }
cited = { message = "exec_action" }

[[cites]]
by = { message = "result", fact = "commit" }
cited = { entity = "Attempt", reached = "captured", fact = "commit" }
