# The Ree machine: where an instance starts, which edges it may take, and when it
# must have settled. Its states and facts are declared in vocabulary/ree.toml.
#
# A change after sealing is a transition out of a terminal state, so "a sealed REE
# is frozen" is this machine's shape, not a separate rule.

name = "Ree"
# A workbench can baseline an REE that was sealed elsewhere.
initial = ["draft", "sealed"]
terminal = ["sealed"]
settles_before_close = false

[[transitions]]
from = "draft"
to = ["draft"]
why = "An authoring change."

[[transitions]]
from = "draft"
to = ["sealed"]
why = "Sealing."
