# The Attempt machine: where an instance starts, which edges it may take, and when it
# must have settled. Its states and facts are declared in vocabulary/attempt.toml.

name = "Attempt"
initial = "pending"
terminal = ["captured", "capture_failed"]
settles_before_close = false

[[transitions]]
from = "pending"
to = ["executing", "capture_failed"]
why = "The before-snapshot either succeeds or fails before anything runs."

[[transitions]]
from = "executing"
to = ["completed", "capture_failed"]

[[transitions]]
from = "completed"
to = ["captured", "capture_failed"]
