# The Receipt machine: where an instance starts, which edges it may take, and when it
# must have settled. Its states and facts are declared in vocabulary/receipt.toml.

name = "Receipt"
initial = ["missing", "not_applicable", "current", "stale"]
settles_before_close = false

[[transitions]]
from = "missing"
to = ["current", "stale", "not_applicable"]

[[transitions]]
from = "current"
to = ["stale", "missing", "not_applicable"]

[[transitions]]
from = "stale"
to = ["current", "missing", "not_applicable"]

[[transitions]]
from = "not_applicable"
to = ["missing", "current", "stale"]
