# One workbench allocation, owned by the supervisor's allocation store.
#
# This machine replaces the hand-written table that lived in
# supervisor/allocation_state.py; the store still refuses any other edge.

name = "Allocation"
owner = "supervisor"
key = "allocation_id"
partition = "ree_id"
evidence = "journal"
initial = "requested"
terminal = ["released"]
# Allocations outlive the API process that holds them.
settles_before_close = false
summary = "Bookkeeping for obtaining, holding, and returning one workbench for one REE."

[states]
requested = "Recorded for an REE; nothing has been asked of a provider yet."
provisioning = "A provider is creating the workbench."
waiting_for_workbench = "The environment exists; the workbench has not dialed in yet."
ready = "The workbench is connected and not yet bound to the REE."
assigned = "The workbench holds the REE and accepts commands."
draining = "The workbench is being released."
released = "The workbench and its storage were returned."
failed = "Obtaining or keeping the workbench failed."
lost = "The workbench disappeared without being released."

[facts]
provider_id = "str?"
workbench_id = "str?"
location_id = "str?"
detail = "str?"

[[transitions]]
from = "requested"
to = ["provisioning", "waiting_for_workbench", "draining", "failed"]
why = "Provider-managed allocations provision; externally managed ones wait for their bench."

[[transitions]]
from = "provisioning"
to = ["waiting_for_workbench", "draining", "failed", "lost"]

[[transitions]]
from = "waiting_for_workbench"
to = ["ready", "draining", "failed", "lost"]

[[transitions]]
from = "ready"
to = ["assigned", "draining", "failed", "lost"]

[[transitions]]
from = "assigned"
to = ["draining", "failed", "lost"]

[[transitions]]
from = "draining"
to = ["released", "failed"]

[[transitions]]
from = "failed"
to = ["draining"]
why = "A failed allocation is still released."

[[transitions]]
from = "lost"
to = ["draining"]
why = "A lost allocation is still released."
