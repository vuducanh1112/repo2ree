# Cross-entity behaviour. Each invariant uses one fixed pattern; see README.md.

# ---- Control plane ------------------------------------------------------------

[[invariant]]
id = "run-success-is-backed"
pattern = "requires"
summary = "A command run reports success only after its attempt was captured as succeeded."
when = { entity = "Run", to = "succeeded", where = { operation = { not = "provision" } } }
require = { entity = "Attempt", key_from = "attempt_id", reached = "captured", where = { outcome = "succeeded" }, order = "before" }

[[invariant]]
id = "dispatch-success-is-captured"
pattern = "requires"
summary = "A successful dispatch result is backed by a captured, successful attempt."
when = { boundary = "dispatch", message = "result", where = { status = "succeeded" } }
require = { entity = "Attempt", key_from = "$key", reached = "captured", where = { outcome = "succeeded" }, order = "before" }

[[invariant]]
id = "execution-was-dispatched"
pattern = "requires"
summary = "Every attempt that executed was dispatched by the supervisor."
when = { entity = "Attempt", to = "executing" }
require = { boundary = "dispatch", message = "exec_action", key_from = "$key", order = "before" }

[[invariant]]
id = "allocation-ends"
pattern = "response"
summary = "An assigned allocation is eventually released, failed, or lost."
when = { entity = "Allocation", to = "assigned" }
eventually = ["released", "failed", "lost"]

# ---- REE domain ---------------------------------------------------------------

[[invariant]]
id = "ree-changes-through-operations"
pattern = "guard"
summary = "The committed REE changes only through dispatched operations, never between them."
when = { entity = "Ree", from = ["draft", "sealed"], to = ["draft", "sealed"] }
require = { where = { cause = "operation" } }

[[invariant]]
id = "sealed-without-stale-evidence"
pattern = "excludes"
summary = "An REE is never sealed while any of its receipts is stale."
when = { entity = "Ree", from = "draft", to = "sealed" }
require = { entity = "Step", in_states = ["stale"] }

# A receipt appears only through the operation that produces it (or a bundle
# load that restores receipts made elsewhere). Edits can make evidence stale or
# current again; they can never create it.

[[invariant]]
id = "source-receipts-come-from-acquisition"
pattern = "guard"
summary = "Source evidence appears only by acquiring source or loading a bundle."
when = { entity = "Step", from = ["(none)", "missing", "not_applicable"], to = ["current", "stale"], where = { kind = "source" } }
require = { where = { operation = { in = ["acquire_source", "load_ree_bundle"] } } }

