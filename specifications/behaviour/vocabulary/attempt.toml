# The words for one execution attempt of a typed command inside an REE.
#
# Core is the owner and the REE's Git history is its journal: capture_command
# rewrites the attempt's record at every phase and publishes the final record as
# a commit. The checker reads those records rather than a separate event file
# (repo2ree_conformance.sources). Its machine is entities/attempt.toml.

name = "Attempt"
kind = "entity"
owner = "core"
key = "attempt_id"
partition = "ree_id"
evidence = "git"
summary = "One command execution inside an REE, from its pending record to its published capture."

[states]
pending = "The attempt record exists; the before-snapshot is not taken yet."
executing = "The before-snapshot was taken and the handler was started."
completed = "The handler returned an outcome; the after-state is not published yet."
captured = "The outcome and after-state are published as a commit."
capture_failed = "Recording failed; the REE files were not rolled back."

[facts]
operation = "str"
run_id = "str"
scope = "str"
# The journal record of the request that dispatched this attempt (see boundaries/dispatch.toml).
# Absent for an attempt nothing dispatched, such as one run in-process.
dispatched_by = "str?"
commit = { type = "str", required_in = ["captured"] }
changed = { type = "bool", required_in = ["captured"] }
error = "str"

[facts.outcome]
type = "str"
required_in = ["completed"]

[facts.outcome.values]
succeeded = "The command did what it was asked."
failed = "The command could not do it."
canceled = "The command stopped because its run was canceled."
