# The words for one receipt: whether the evidence an author step produced still speaks
# for the REE, as core's audit reports it around each attempt
# (core/domain/ree/audit.py). The checker turns differences between audits into
# transitions. Its machine is entities/receipt.toml.

name = "Receipt"
kind = "entity"
owner = "core"
key = "step_id"
partition = "ree_id"
evidence = "git"
summary = "One step's receipt, and whether it still speaks for the REE as it now stands."

[states]
missing = "Applicable, and no receipt: the step has not run successfully."
current = "The receipt still matches everything it rests on."
stale = "A receipt exists, but something it rests on moved or was removed."
not_applicable = "Nothing is declared for this step to be about, and there is no receipt."

[facts]
# source, evaluation, hardware, runtime, sbom, sbom_cross_check, test_activation, or experiment:<name>.
step = "str"
operation = "str?"
attempt_id = "str?"

# The step without the experiment name.
[facts.kind]
type = "str"
required = true

[facts.kind.values]
source = "The frozen source."
evaluation = "The reproducibility evaluation."
hardware = "The observed hardware."
runtime = "The built runtime."
sbom = "The runtime's SBOM."
sbom_cross_check = "Declared dependencies checked against the SBOM."
test_activation = "The runtime's activation test."
experiment = "One declared experiment."

[facts.cause]
type = "str"

[facts.cause.values]
operation = "An attempt changed the standing."
external = "The standing changed between attempts."
baseline = "The standing as first audited, before any attempt."
