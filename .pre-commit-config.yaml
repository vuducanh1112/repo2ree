# The hooks here are cheap by design. The expensive checking lives in
# `make commit-gate`, which you run in your own terminal where its output
# streams; the hook only confirms that it ran against the content you are
# committing.
#
# Running the gate *from* the hook was the first design and it did not survive
# contact: ~50s during which pre-commit shows nothing, because it captures hook
# output and prints it only after the hook exits. A `git commit` that looks hung
# for a minute is a `git commit --no-verify` habit waiting to happen, and that
# costs the guarantee entirely.
repos:
  - repo: local
    hooks:
      # Compares the tree recorded by the last passing `make commit-gate` with
      # the tree you are about to commit — a hash comparison, ~10ms. Content
      # equality is the whole check: any edit to any staged file changes the
      # tree hash, so a certificate can be stale but never wrong.
      #
      # What it does not cover: the gate could have passed under a different
      # toolchain than you have now. The ruff pin in pyproject.toml is what
      # keeps that honest, after a pinned ruff-pre-commit hook drifted from it
      # and let an RUF043 finding through a commit the gate had just passed.
      - id: commit-gate-certificate
        name: commit-gate ran on this exact content
        language: system
        entry: scripts/publish/commit-gate-stamp.sh verify
        always_run: true
        pass_filenames: false

      # Keep the pinned npm-deps hash in sync with the GUI lockfile. Not part
      # of commit-gate: it is a nix prefetch measured in minutes, and its entire
      # input is package-lock.json, so `files` here states exactly what can change
      # its answer rather than guessing. Regenerates nix/gui-npm-deps.hash
      # and, if it changed, fails the commit so you re-stage it (pre-commit fails
      # any hook that modifies a file).
      # Prevents committing a lockfile change with a stale hash that would only break
      # later at `nix build` time.
      - id: gui-npm-hash
        name: GUI npm-deps hash in sync with lockfile
        language: system
        entry: make gui-npm-hash
        files: ^gui/package-lock\.json$
        pass_filenames: false
