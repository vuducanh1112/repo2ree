[project]
name = "repo2ree-core"
version = "0.1.0"
dependencies = [
    "repo2ree-protocol",
    "pydantic~=2.11.7",
    # environment.yml parsing in repo_profiler.sources.manifests.
    "pyyaml~=6.0",
]

[dependency-groups]
# Test-only: the official Software Heritage CLI, used by test_swhid.py to
# cross-check our SWHID reimplementation. The test skips when absent.
dev = [
    "swh.model~=8.4.1",
    # mypy stubs for the pyyaml runtime dependency.
    "types-pyyaml~=6.0",
]

[tool.uv.sources]
repo2ree-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_core"]
