[project]
name = "repo2ree-core"
version = "0.1.0"
dependencies = [
    "docker~=7.1.0",
    "dockerfile-parse~=2.0.1",
    "GitPython~=3.1.45",
    "kubernetes~=35.0.0",
    "packaging~=25.0",
    "pydantic~=2.11.7",
    "pydantic-settings~=2.12.0",
    "python-debian~=1.0.1",
    "PyYaml~=6.0.3",
    "requests~=2.32.5",
    "sqlmodel~=0.0.31",
    "swh.model~=8.4.1",
    "tomli~=2.2.1",
    "tomli-w~=1.2.0",
]

[dependency-groups]
# Type stubs for core's runtime dependencies (used by mypy only).
dev = [
    "types-requests~=2.32.0",
    "types-PyYAML~=6.0.0",
    "types-dockerfile-parse~=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_core"]