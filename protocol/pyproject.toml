[project]
name = "repo2ree-protocol"
version = "0.1.0"
dependencies = [
    "pydantic~=2.11.7",
    "requests~=2.32.5",
    "opentelemetry-sdk~=1.42.1",
    "opentelemetry-exporter-otlp-proto-http~=1.42.1",
    "opentelemetry-instrumentation-logging~=0.63b1",
]

[dependency-groups]
# Type stubs for protocol's runtime dependencies (used by mypy only).
dev = [
    "types-requests~=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_protocol"]
