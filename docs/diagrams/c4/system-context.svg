<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">repo2ree C4 system context</title>
  <desc id="description">REE authors and reviewers use repo2ree. Repo2ree acquires pinned source from source hosting, dispatches work to isolated execution infrastructure, and returns sealed portable REEs with evidence. Execution infrastructure obtains dependencies from package and image registries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px system-ui, sans-serif; fill: #475569; }
      .node-title { font: 700 21px system-ui, sans-serif; fill: #fff; text-anchor: middle; }
      .node-type { font: 600 13px system-ui, sans-serif; fill: #dbeafe; text-anchor: middle; letter-spacing: 1px; }
      .node-copy { font: 15px system-ui, sans-serif; fill: #eff6ff; text-anchor: middle; }
      .external-title { font: 700 20px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; }
      .external-type { font: 600 13px system-ui, sans-serif; fill: #475569; text-anchor: middle; letter-spacing: 1px; }
      .external-copy { font: 15px system-ui, sans-serif; fill: #334155; text-anchor: middle; }
      .person-title { font: 700 20px system-ui, sans-serif; fill: #fff; text-anchor: middle; }
      .person-type { font: 600 13px system-ui, sans-serif; fill: #cffafe; text-anchor: middle; letter-spacing: 1px; }
      .person-copy { font: 15px system-ui, sans-serif; fill: #ecfeff; text-anchor: middle; }
      .relation { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .relation-label { font: 600 14px system-ui, sans-serif; fill: #334155; text-anchor: middle; }
      .relation-note { font: 13px system-ui, sans-serif; fill: #64748b; text-anchor: middle; }
      .legend { font: 13px system-ui, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="canvas" width="1400" height="900" rx="16"/>
  <text class="title" x="48" y="55">repo2ree — System context</text>
  <text class="subtitle" x="48" y="84">Who uses repo2ree and which systems participate in authoring and reproducing a REE</text>

  <!-- Relationships are drawn first so nodes remain visually dominant. -->
  <path class="relation" d="M 300 397 L 490 397"/>
  <text class="relation-label" x="395" y="371">Authors and seals REEs</text>
  <text class="relation-note" x="395" y="391">supplies source via GUI or API</text>

  <path class="relation" d="M 700 222 L 700 286"/>
  <text class="relation-label" x="832" y="247">Acquires a pinned snapshot</text>
  <text class="relation-note" x="817" y="268">Git fetch or archive upload</text>

  <path class="relation" d="M 910 356 L 1035 356"/>
  <text class="relation-label" x="973" y="315">Provisions</text>
  <text class="relation-label" x="973" y="333">a workbench</text>

  <path class="relation" d="M 1035 446 L 910 446"/>
  <text class="relation-label" x="973" y="474">Returns evidence</text>
  <text class="relation-note" x="973" y="492">and artifacts</text>

  <path class="relation" d="M 1200 520 L 1200 640"/>
  <text class="relation-label" x="1260" y="568">Obtains build inputs</text>
  <text class="relation-note" x="1260" y="589">images and packages</text>

  <path class="relation" d="M 643 520 C 643 570, 643 603, 643 648"/>
  <text class="relation-label" x="520" y="574">Provides the sealed REE</text>
  <text class="relation-note" x="518" y="595">with its recorded evidence</text>

  <path class="relation" d="M 782 648 C 782 603, 782 570, 782 520"/>
  <text class="relation-label" x="888" y="574">Loads and reproduces</text>
  <text class="relation-note" x="871" y="595">on a fresh workbench</text>

  <!-- People -->
  <g>
    <rect x="40" y="300" width="260" height="195" rx="12" fill="#0e7490" stroke="#155e75" stroke-width="2"/>
    <circle cx="170" cy="337" r="17" fill="#cffafe"/>
    <path d="M 135 381 C 139 354, 201 354, 205 381 L 205 390 L 135 390 Z" fill="#cffafe"/>
    <text class="person-title" x="170" y="421">REE author</text>
    <text class="person-type" x="170" y="444">[PERSON]</text>
    <text class="person-copy" x="170" y="468">Creates and publishes a</text>
    <text class="person-copy" x="170" y="488">reproducible environment</text>
  </g>

  <g>
    <rect x="520" y="648" width="385" height="182" rx="12" fill="#0e7490" stroke="#155e75" stroke-width="2"/>
    <circle cx="712" cy="681" r="15" fill="#cffafe"/>
    <path d="M 681 720 C 685 696, 739 696, 743 720 L 743 728 L 681 728 Z" fill="#cffafe"/>
    <text class="person-title" x="712" y="757">REE reviewer</text>
    <text class="person-type" x="712" y="779">[PERSON]</text>
    <text class="person-copy" x="712" y="802">Independently rebuilds and verifies</text>
    <text class="person-copy" x="712" y="822">a published REE</text>
  </g>

  <!-- System under consideration -->
  <g>
    <rect x="490" y="286" width="420" height="234" rx="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/>
    <text class="node-title" x="700" y="344">repo2ree</text>
    <text class="node-type" x="700" y="370">[SOFTWARE SYSTEM]</text>
    <text class="node-copy" x="700" y="407">Turns source and authored recipes into a sealed,</text>
    <text class="node-copy" x="700" y="430">portable reproducible execution environment.</text>
    <text class="node-copy" x="700" y="462">Coordinates independent reconstruction and records</text>
    <text class="node-copy" x="700" y="485">source, build, activation, and experiment evidence.</text>
  </g>

  <!-- External systems -->
  <g>
    <rect x="510" y="112" width="380" height="110" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text class="external-title" x="700" y="151">Source hosting</text>
    <text class="external-type" x="700" y="174">[EXTERNAL SYSTEM]</text>
    <text class="external-copy" x="700" y="201">Git forge or archival source repository</text>
  </g>

  <g>
    <rect x="1035" y="286" width="325" height="234" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text class="external-title" x="1198" y="350">Execution infrastructure</text>
    <text class="external-type" x="1198" y="376">[EXTERNAL SYSTEM]</text>
    <text class="external-copy" x="1198" y="413">Hosts an isolated workbench</text>
    <text class="external-copy" x="1198" y="437">where source is evaluated, a runtime</text>
    <text class="external-copy" x="1198" y="461">is built, and experiments are run</text>
  </g>

  <g>
    <rect x="1040" y="640" width="320" height="130" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text class="external-title" x="1200" y="681">Package and image registries</text>
    <text class="external-type" x="1200" y="705">[EXTERNAL SYSTEMS]</text>
    <text class="external-copy" x="1200" y="735">Provide base images and dependencies</text>
  </g>

  <g transform="translate(48 861)">
    <rect width="18" height="18" rx="3" fill="#2563eb"/><text class="legend" x="28" y="14">repo2ree system boundary</text>
    <rect x="220" width="18" height="18" rx="3" fill="#0e7490"/><text class="legend" x="248" y="14">person</text>
    <rect x="330" width="18" height="18" rx="3" fill="#e2e8f0" stroke="#64748b"/><text class="legend" x="358" y="14">external system</text>
  </g>
</svg>
