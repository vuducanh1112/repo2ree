<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Federated compute through connected agents</title>
  <desc id="description">Researchers use a repo2ree API that coordinates work without holding infrastructure credentials. Agents installed inside private, university, institutional, and cloud boundaries connect outward to the API. Each agent uses local credentials to access its own Docker host, scheduler, cluster, or cloud resources and returns logs, evidence, and artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2563eb"/>
    </marker>
    <style>
      .canvas{fill:#f8fafc}.heading{font:700 31px system-ui,sans-serif;fill:#0f172a}.subtitle{font:16px system-ui,sans-serif;fill:#475569}
      .control-boundary{fill:#eff6ff;stroke:#2563eb;stroke-width:2.3;stroke-dasharray:9 6}.owner-boundary{fill:#fff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:9 6}
      .control{fill:#2563eb;stroke:#1d4ed8;stroke-width:2.5}.agent{fill:#0f766e;stroke:#115e59;stroke-width:2.5}.compute{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.person{fill:#0e7490;stroke:#155e75;stroke-width:2.5}
      .boundary-label{font:700 14px system-ui,sans-serif;fill:#475569;letter-spacing:.6px}.name{font:700 18px system-ui,sans-serif;fill:#fff;text-anchor:middle}.type{font:600 11px system-ui,sans-serif;fill:#dbeafe;text-anchor:middle;letter-spacing:.9px}.copy{font:13px system-ui,sans-serif;fill:#eff6ff;text-anchor:middle}
      .dark-name{font:700 17px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.dark-type{font:600 11px system-ui,sans-serif;fill:#475569;text-anchor:middle;letter-spacing:.8px}.dark-copy{font:13px system-ui,sans-serif;fill:#334155;text-anchor:middle}
      .line{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.dial{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrowBlue)}.local{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
      .label{font:600 13px system-ui,sans-serif;fill:#334155;text-anchor:middle}.dial-label{font:700 13px system-ui,sans-serif;fill:#1d4ed8;text-anchor:middle}.note{font:13px system-ui,sans-serif;fill:#475569}.note-strong{font:700 13px system-ui,sans-serif;fill:#0f172a}
      .legend{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.legend-title{font:700 14px system-ui,sans-serif;fill:#0f172a}.legend-copy{font:13px system-ui,sans-serif;fill:#475569}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1120" rx="18"/>
  <text class="heading" x="48" y="58">Federated compute through connected agents</text>
  <text class="subtitle" x="48" y="87">Resource owners install an agent inside their boundary; repo2ree coordinates work without taking ownership of their infrastructure</text>

  <!-- User and control plane -->
  <rect class="person" x="52" y="380" width="238" height="150" rx="13"/>
  <text class="name" x="171" y="423">Researcher</text>
  <text class="type" x="171" y="447">PERSON</text>
  <text class="copy" x="171" y="478">Selects an eligible resource</text>
  <text class="copy" x="171" y="499">and submits REE operations</text>

  <rect class="control-boundary" x="365" y="260" width="415" height="400" rx="18"/>
  <text class="boundary-label" x="390" y="292">REPO2REE SERVICE BOUNDARY</text>
  <rect class="control" x="415" y="330" width="315" height="178" rx="13"/>
  <text class="name" x="572" y="375">API / control plane</text>
  <text class="type" x="572" y="399">COORDINATION</text>
  <text class="copy" x="572" y="430">Registers agents and capabilities</text>
  <text class="copy" x="572" y="452">Routes work and tracks runs</text>
  <text class="copy" x="572" y="474">Receives logs, evidence, and artifacts</text>
  <rect class="legend" x="415" y="544" width="315" height="78" rx="10"/>
  <text class="legend-title" x="435" y="572">The control plane does not receive</text>
  <text class="legend-copy" x="435" y="596">cloud keys, kubeconfigs, scheduler credentials,</text>
  <text class="legend-copy" x="435" y="615">or a container-runtime socket.</text>

  <path class="line" d="M290 455 H415"/>
  <text class="label" x="352" y="438">HTTPS / JSON</text>

  <!-- Private resource -->
  <rect class="owner-boundary" x="890" y="125" width="645" height="200" rx="16"/>
  <text class="boundary-label" x="914" y="155">PRIVATE USER OR LAB BOUNDARY</text>
  <rect class="agent" x="930" y="182" width="230" height="105" rx="12"/>
  <text class="name" x="1045" y="218">repo2ree agent</text>
  <text class="type" x="1045" y="242">OWNER-INSTALLED GATEWAY</text>
  <text class="copy" x="1045" y="268">Advertises local capabilities</text>
  <rect class="compute" x="1248" y="182" width="245" height="105" rx="12"/>
  <text class="dark-name" x="1370" y="218">Workstation or server</text>
  <text class="dark-type" x="1370" y="242">LOCAL COMPUTE</text>
  <text class="dark-copy" x="1370" y="268">Docker / isolated workbenches</text>
  <path class="local" d="M1160 234 H1248"/>
  <text class="label" x="1204" y="218">local access</text>

  <!-- University resource -->
  <rect class="owner-boundary" x="890" y="350" width="645" height="200" rx="16"/>
  <text class="boundary-label" x="914" y="380">UNIVERSITY COMPUTE BOUNDARY</text>
  <rect class="agent" x="930" y="407" width="230" height="105" rx="12"/>
  <text class="name" x="1045" y="443">repo2ree agent</text>
  <text class="type" x="1045" y="467">SITE-OPERATED GATEWAY</text>
  <text class="copy" x="1045" y="493">Applies site policy and quotas</text>
  <rect class="compute" x="1248" y="407" width="245" height="105" rx="12"/>
  <text class="dark-name" x="1370" y="443">University cluster</text>
  <text class="dark-type" x="1370" y="467">SCHEDULER / CLUSTER</text>
  <text class="dark-copy" x="1370" y="493">HPC, Kubernetes, or local runtime</text>
  <path class="local" d="M1160 459 H1248"/>
  <text class="label" x="1204" y="443">site API</text>

  <!-- Institutional resource -->
  <rect class="owner-boundary" x="890" y="575" width="645" height="200" rx="16"/>
  <text class="boundary-label" x="914" y="605">INSTITUTIONAL OR NATIONAL FACILITY BOUNDARY</text>
  <rect class="agent" x="930" y="632" width="230" height="105" rx="12"/>
  <text class="name" x="1045" y="668">repo2ree agent</text>
  <text class="type" x="1045" y="692">FACILITY-OPERATED GATEWAY</text>
  <text class="copy" x="1045" y="718">Exposes approved resource classes</text>
  <rect class="compute" x="1248" y="632" width="245" height="105" rx="12"/>
  <text class="dark-name" x="1370" y="668">Shared facility</text>
  <text class="dark-type" x="1370" y="692">MANAGED COMPUTE</text>
  <text class="dark-copy" x="1370" y="718">CPU, GPU, or specialist hardware</text>
  <path class="local" d="M1160 684 H1248"/>
  <text class="label" x="1204" y="668">site API</text>

  <!-- Cloud resource -->
  <rect class="owner-boundary" x="890" y="800" width="645" height="200" rx="16"/>
  <text class="boundary-label" x="914" y="830">USER OR ORGANIZATION CLOUD BOUNDARY</text>
  <rect class="agent" x="930" y="857" width="230" height="105" rx="12"/>
  <text class="name" x="1045" y="893">repo2ree agent</text>
  <text class="type" x="1045" y="917">ACCOUNT-LOCAL GATEWAY</text>
  <text class="copy" x="1045" y="943">Uses account-local identity</text>
  <rect class="compute" x="1248" y="857" width="245" height="105" rx="12"/>
  <text class="dark-name" x="1370" y="893">Cloud resources</text>
  <text class="dark-type" x="1370" y="917">ELASTIC COMPUTE</text>
  <text class="dark-copy" x="1370" y="943">VMs, containers, or managed clusters</text>
  <path class="local" d="M1160 909 H1248"/>
  <text class="label" x="1204" y="893">cloud API</text>

  <!-- Outbound agent connections. Arrowheads terminate at the API. -->
  <path class="dial" d="M930 234 H842 Q810 234 810 270 V350 Q810 402 730 402"/>
  <path class="dial" d="M930 459 H730"/>
  <path class="dial" d="M930 684 H842 Q810 684 810 650 V528 Q810 476 730 476"/>
  <path class="dial" d="M930 909 H820 Q810 909 810 880 V555 Q810 490 730 490"/>
  <text class="dial-label" x="830" y="215">outbound secure connection</text>
  <text class="dial-label" x="830" y="441">outbound secure connection</text>
  <text class="dial-label" x="830" y="705">outbound secure connection</text>
  <text class="dial-label" x="830" y="930">outbound secure connection</text>

  <!-- Summary -->
  <rect class="legend" x="52" y="760" width="728" height="240" rx="14"/>
  <text class="legend-title" x="80" y="797">Federation principle</text>
  <text class="legend-copy" x="80" y="828">The agent is a gateway to compute, not the compute resource itself.</text>
  <text class="legend-copy" x="80" y="856">It translates repo2ree operations into the runtime or scheduler available</text>
  <text class="legend-copy" x="80" y="878">inside its boundary and returns ordered logs, evidence, and artifacts.</text>
  <text class="note-strong" x="80" y="918">Resource owners retain control of:</text>
  <text class="note" x="80" y="944">• credentials and network access   • admission policy and quotas</text>
  <text class="note" x="80" y="970">• supported hardware and runtimes   • agent registration and revocation</text>

  <text class="note" x="48" y="1080">Architecture direction: the current agent supports Docker; scheduler, cluster, and cloud adapters are intended extension points.</text>
</svg>
