<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Federated compute uses separate capacity and execution connections</title>
  <desc id="description">A researcher uses the repo2ree control plane. Inside a resource owner's boundary, a provider opens an outbound capacity connection and uses the local Docker engine to create a per-REE workbench. The workbench opens a different outbound execution connection and returns logs, results, and files directly. The provider never receives REE commands, and the workbench cannot create infrastructure. Kubernetes, HPC, and cloud providers are future extension points.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0f766e"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#475569"/>
    </marker>
    <style>
      .canvas{fill:#f8fafc}
      .heading{font:700 31px system-ui,sans-serif;fill:#0f172a}
      .subtitle{font:16px system-ui,sans-serif;fill:#475569}
      .boundary{fill:#fff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:9 6}
      .service-boundary{fill:#eff6ff;stroke:#2563eb;stroke-width:2.2;stroke-dasharray:9 6}
      .workbench-boundary{fill:#f0fdfa;stroke:#0f766e;stroke-width:2}
      .control{fill:#2563eb;stroke:#1d4ed8;stroke-width:2.5}
      .provider{fill:#0f766e;stroke:#115e59;stroke-width:2.5}
      .runtime{fill:#f1f5f9;stroke:#64748b;stroke-width:2}
      .executor{fill:#fff;stroke:#0f766e;stroke-width:1.7}
      .person{fill:#0e7490;stroke:#155e75;stroke-width:2.5}
      .future{fill:#fff7ed;stroke:#c2410c;stroke-width:1.8;stroke-dasharray:7 5}
      .badge-current{fill:#dcfce7;stroke:#16a34a;stroke-width:1.4}
      .badge-future{fill:#ffedd5;stroke:#ea580c;stroke-width:1.4}
      .boundary-label{font:700 14px system-ui,sans-serif;fill:#475569;letter-spacing:.6px}
      .name{font:700 18px system-ui,sans-serif;fill:#fff;text-anchor:middle}
      .type{font:600 11px system-ui,sans-serif;fill:#dbeafe;text-anchor:middle;letter-spacing:.9px}
      .copy{font:13px system-ui,sans-serif;fill:#eff6ff;text-anchor:middle}
      .dark-name{font:700 17px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}
      .dark-type{font:600 11px system-ui,sans-serif;fill:#475569;text-anchor:middle;letter-spacing:.8px}
      .dark-copy{font:13px system-ui,sans-serif;fill:#334155;text-anchor:middle}
      .small-copy{font:12px system-ui,sans-serif;fill:#334155;text-anchor:middle}
      .blue-line{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}
      .teal-line{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#arrowTeal)}
      .local-line{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrowSlate)}
      .label{font:700 13px system-ui,sans-serif;fill:#334155;text-anchor:middle}
      .blue-label{font:700 13px system-ui,sans-serif;fill:#1d4ed8;text-anchor:middle}
      .teal-label{font:700 13px system-ui,sans-serif;fill:#0f766e;text-anchor:middle}
      .note{font:13px system-ui,sans-serif;fill:#475569}
      .note-strong{font:700 13px system-ui,sans-serif;fill:#0f172a}
      .badge-copy{font:700 12px system-ui,sans-serif;text-anchor:middle;letter-spacing:.6px}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1000" rx="18"/>
  <text class="heading" x="48" y="58">Federated compute: capacity and execution stay separate</text>
  <text class="subtitle" x="48" y="87">The provider creates workbenches; each workbench executes REE commands over its own outbound connection</text>

  <!-- Researcher -->
  <rect class="person" x="48" y="340" width="220" height="142" rx="13"/>
  <text class="name" x="158" y="382">Researcher</text>
  <text class="type" x="158" y="406">PERSON</text>
  <text class="copy" x="158" y="437">Selects a location</text>
  <text class="copy" x="158" y="458">and requests REE work</text>

  <!-- Control plane -->
  <rect class="service-boundary" x="330" y="150" width="420" height="620" rx="18"/>
  <text class="boundary-label" x="355" y="183">REPO2REE SERVICE BOUNDARY</text>
  <rect class="control" x="382" y="222" width="316" height="232" rx="13"/>
  <text class="name" x="540" y="262">API / control plane</text>
  <text class="type" x="540" y="286">COORDINATION</text>
  <text class="copy" x="540" y="320">Tracks locations and allocations</text>
  <text class="copy" x="540" y="342">Routes each REE to its workbench</text>
  <text class="copy" x="540" y="364">Tracks runs and staged transfers</text>
  <text class="copy" x="540" y="399">No host Docker socket</text>
  <text class="copy" x="540" y="420">No infrastructure credentials</text>

  <rect class="runtime" x="382" y="512" width="316" height="192" rx="12"/>
  <text class="dark-name" x="540" y="550">Two scoped authorities</text>
  <text class="dark-type" x="540" y="574">SEPARATE CONNECTIONS + CREDENTIALS</text>
  <circle cx="411" cy="609" r="7" fill="#2563eb"/>
  <text class="note-strong" x="430" y="614">Capacity</text>
  <text class="note" x="430" y="636">ensure · inspect · release</text>
  <circle cx="411" cy="669" r="7" fill="#0f766e"/>
  <text class="note-strong" x="430" y="674">Execution</text>
  <text class="note" x="430" y="696">commands · logs · results · files</text>

  <path class="local-line" d="M268 411 H382"/>
  <text class="label" x="325" y="394">HTTPS</text>

  <!-- Owner-operated compute -->
  <rect class="boundary" x="840" y="112" width="712" height="670" rx="18"/>
  <text class="boundary-label" x="866" y="145">RESOURCE OWNER BOUNDARY · CURRENT DOCKER LOCATION</text>
  <rect class="badge-current" x="1385" y="127" width="132" height="31" rx="15"/>
  <text class="badge-copy" x="1451" y="148" fill="#166534">AVAILABLE NOW</text>

  <rect class="provider" x="910" y="205" width="260" height="145" rx="13"/>
  <text class="name" x="1040" y="244">Docker provider</text>
  <text class="type" x="1040" y="268">CAPACITY ONLY</text>
  <text class="copy" x="1040" y="300">Advertises location + images</text>
  <text class="copy" x="1040" y="322">Never receives REE commands</text>

  <rect class="runtime" x="1250" y="205" width="235" height="145" rx="13"/>
  <text class="dark-name" x="1367" y="244">Docker engine</text>
  <text class="dark-type" x="1367" y="268">LOCAL INFRASTRUCTURE</text>
  <text class="dark-copy" x="1367" y="300">Host socket stays here</text>
  <text class="dark-copy" x="1367" y="322">Runs and removes workbench</text>

  <path class="local-line" d="M1170 278 H1250"/>
  <text class="label" x="1210" y="261">local API</text>

  <!-- Current workbench -->
  <rect class="workbench-boundary" x="910" y="434" width="575" height="276" rx="15"/>
  <text class="boundary-label" x="936" y="468">ONE WORKBENCH · ONE REE ALLOCATION</text>

  <rect class="provider" x="948" y="500" width="225" height="153" rx="12"/>
  <text class="name" x="1060" y="538">Workbench service</text>
  <text class="type" x="1060" y="562">EXECUTION ONLY</text>
  <text class="copy" x="1060" y="594">Receives typed commands</text>
  <text class="copy" x="1060" y="616">Streams results directly</text>

  <rect class="executor" x="1218" y="500" width="225" height="68" rx="10"/>
  <text class="dark-name" x="1330" y="529">Short-lived executor</text>
  <text class="small-copy" x="1330" y="551">runs one command</text>

  <rect class="runtime" x="1218" y="588" width="225" height="65" rx="10"/>
  <text class="dark-name" x="1330" y="616">REE tree + private DinD</text>
  <text class="small-copy" x="1330" y="638">no host Docker socket</text>

  <path class="local-line" d="M1173 534 H1218"/>
  <path class="local-line" d="M1330 568 V588"/>

  <path class="local-line" d="M1367 350 V405 Q1367 420 1345 434"/>
  <text class="label" x="1438" y="400">starts workbench</text>

  <!-- Outbound connections terminate at the control plane -->
  <path class="blue-line" d="M910 251 H815 Q790 251 790 280 V298 Q790 315 698 315"/>
  <text class="blue-label" x="801" y="233">outbound capacity connection</text>

  <path class="teal-line" d="M948 577 H820 Q790 577 790 548 V395 Q790 379 698 379"/>
  <text class="teal-label" x="812" y="600">outbound execution connection</text>

  <!-- Authority notes -->
  <rect class="runtime" x="48" y="820" width="702" height="124" rx="13"/>
  <text class="note-strong" x="75" y="852">Authority split</text>
  <circle cx="83" cy="884" r="7" fill="#2563eb"/>
  <text class="note" x="103" y="889">Capacity protocol exposes lifecycle calls, never an REE command.</text>
  <circle cx="83" cy="918" r="7" fill="#0f766e"/>
  <text class="note" x="103" y="923">Execution protocol is allocation-scoped and has no lifecycle calls.</text>

  <!-- Future provider backends -->
  <rect class="future" x="840" y="820" width="712" height="124" rx="13"/>
  <rect class="badge-future" x="1385" y="835" width="132" height="31" rx="15"/>
  <text class="badge-copy" x="1451" y="856" fill="#9a3412">FUTURE</text>
  <text class="note-strong" x="870" y="854">Provider protocol extension points</text>
  <text class="note" x="870" y="886">Kubernetes · HPC schedulers · cloud VMs · resource and quota matching</text>
  <text class="note" x="870" y="918">These backends are not implemented by the current Docker provider.</text>
</svg>
