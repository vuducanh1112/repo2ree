[project]
name = "repo2ree-assurance-dossier"
version = "0.1.0"
description = "The dossier format: behaviour evidence collected from a deployment, and where each piece came from."
requires-python = "~=3.13.0"
dependencies = ["pydantic~=2.11.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_assurance_dossier"]


[tool.importlinter]
include_external_packages = true
root_packages = [
    "repo2ree_assurance_dossier", "repo2ree_assurance_collector", "repo2ree_assurance_checker", "repo2ree_assurance_traceview", "repo2ree_api",
    "repo2ree_core", "repo2ree_docker", "repo2ree_executor", "repo2ree_provider_docker", "repo2ree_protocol",
    "repo2ree_supervisor", "repo2ree_workbench",
]

# The format is the leaf every assurance step shares: collection writes it,
# verification and views read it. It knows none of them, and nothing of the
# runtime that produced the evidence it describes.
[[tool.importlinter.contracts]]
name = "The dossier format depends on nothing it describes or serves"
type = "forbidden"
source_modules = ["repo2ree_assurance_dossier"]
forbidden_modules = [
    "repo2ree_assurance_collector", "repo2ree_assurance_checker", "repo2ree_assurance_traceview", "repo2ree_api", "repo2ree_core",
    "repo2ree_docker", "repo2ree_executor", "repo2ree_provider_docker", "repo2ree_protocol",
    "repo2ree_supervisor", "repo2ree_workbench",
]
