[project]
name = "repo2ree-assurance-checker"
version = "0.1.0"
description = "Check repo2ree behaviour evidence against the declared behaviour specification."
requires-python = "~=3.13.0"
# cryptography stays on 46.x (OpenSSL 3.5). From 48 on, its wheels bundle OpenSSL 4.0, whose CPU feature probe
# dies of an illegal instruction where the kernel reports sve2 without sve, as on a virtualized Apple Silicon CPU
# (Docker on a Mac). OPENSSL_armcap=0 skips the probe and 50.0.2 then works; raise the pin once upstream copes.
dependencies = ["cryptography~=46.0.3", "pydantic~=2.11.7", "repo2ree-assurance-dossier"]

[tool.uv.sources]
repo2ree-assurance-dossier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_assurance_checker"]


[tool.importlinter]
include_external_packages = true
root_packages = [
    "repo2ree_assurance_checker", "repo2ree_assurance_dossier", "repo2ree_api", "repo2ree_core", "repo2ree_cli", "repo2ree_protocol",
    "repo2ree_supervisor", "repo2ree_workbench",
]

# The checker is the oracle for code it must not share fate with: it reads the
# specification and evidence files, never the implementation that produced them.
[[tool.importlinter.contracts]]
name = "Checker stays independent of runtime packages"
type = "forbidden"
source_modules = ["repo2ree_assurance_checker"]
forbidden_modules = [
    "repo2ree_api", "repo2ree_core", "repo2ree_cli",
    "repo2ree_protocol", "repo2ree_supervisor", "repo2ree_workbench",
]

# Rules are pure: the same specification and evidence always give the same verdicts.
[[tool.importlinter.contracts]]
name = "Checker rules have no I/O dependencies"
type = "forbidden"
source_modules = [
    "repo2ree_assurance_checker.spec",
    "repo2ree_assurance_checker.evidence",
    "repo2ree_assurance_checker.check",
    "repo2ree_assurance_checker.codegen",
    "repo2ree_assurance_checker.report",
    "repo2ree_assurance_checker.views",
    "repo2ree_assurance_checker.html",
]
forbidden_modules = ["os", "sys", "subprocess", "socket", "http", "urllib", "tempfile", "shutil", "random", "uuid", "time"]
allow_indirect_imports = true
