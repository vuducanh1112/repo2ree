# Behaviour verdicts the behaviour gate accepts from an e2e test other than "passed".
#
# This belongs to the oracle (the spec-isolation hook keeps it apart from runtime
# code): an entry excuses evidence, so writing one beside the code it excuses
# would let any change pass. Each entry names one test and the exact rules it
# leaves violated or inconclusive; the gate requires those sets to match exactly.
# A fix that makes such a test conform makes its entry stale, and a stale entry
# fails the gate too: remove it with the fix's oracle commit.

[[expected]]
test = "api/tests/system/test_failures.py::test_workbench_lost_during_a_build"
violated = ["machine:Allocation", "allocation-ends"]
# The bench is killed with the REE inside it, so no archive of its history exists:
# the attempts its dispatches report cannot be witnessed.
inconclusive = ["api-success-is-recorded", "dispatch-success-is-captured"]
reason = """Product bug (the test is a strict xfail): the run fails but the allocation stays \
assigned when its workbench is lost, so it is still assigned when the API closes for good."""

# Specified rules, edges, and messages no gated test reaches, and why.
#
# Each test's verdicts pass a rule nothing triggered, so only the suite as a whole
# can say a rule was ever tested. The behaviour gate requires the gated tests
# together to reach everything the specification declares except what is listed
# here: a change that stops reaching an item fails the gate, and a test that starts
# reaching a listed item makes its entry stale, which fails the gate too until the
# entry goes. This list is what a receipt does not prove.

[[unreached]]
items = ["Allocation assigned -> lost"]
reason = """test_workbench_lost_during_a_build is where this belongs, but the allocation \
stays assigned when its workbench is lost (the product bug excused above)."""

[[unreached]]
items = [
  "Allocation assigned -> failed",
  "Allocation draining -> failed",
  "Allocation failed -> draining",
  "Allocation lost -> draining",
  "Allocation provisioning -> draining",
  "Allocation provisioning -> failed",
  "Allocation provisioning -> lost",
  "Allocation ready -> draining",
  "Allocation ready -> failed",
  "Allocation ready -> lost",
  "Allocation requested -> draining",
  "Allocation requested -> failed",
  "Allocation requested -> waiting_for_workbench",
  "Allocation waiting_for_workbench -> draining",
  "Allocation waiting_for_workbench -> failed",
  "Allocation waiting_for_workbench -> lost",
]
reason = """Needs a provider that fails, loses, or drains a bench before it is assigned; \
the stacks' provider never does."""

[[unreached]]
items = [
  "Attempt pending -> capture_failed",
  "Attempt executing -> capture_failed",
  "Attempt completed -> capture_failed",
]
reason = """Needs Git capture inside the REE to fail; only the in-process scenarios \
inject that fault."""

[[unreached]]
items = ["Ree (none) -> sealed"]
reason = """Needs a workbench that baselines an REE sealed elsewhere; loading a sealed \
bundle starts a fresh draft."""

[[unreached]]
items = ["dispatch: error", "dispatch: abandoned"]
reason = """Needs a workbench that answers a dispatched action with an error or never \
answers it."""

[[unreached]]
items = [
  "AuthorApiAction requested -> canceling",
  "AuthorApiAction canceling -> succeeded",
  "AuthorApiAction canceling -> failed",
]
reason = """Cancellation is exercised only while a build runs, where the canceled build \
settles canceled; canceling before a worker starts, or work finishing after the cancel, \
needs a race the gated tiers do not stage."""
