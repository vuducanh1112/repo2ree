# Behaviour verdicts the assurance gate accepts from an e2e test other than "passed".
#
# This belongs to the oracle (the spec-isolation hook keeps it apart from runtime
# code): an entry excuses evidence, so writing one beside the code it excuses
# would let any change pass. Each entry names one test and the exact rules it
# leaves violated or inconclusive; the gate requires those sets to match exactly.
# A fix that makes such a test conform makes its entry stale, and a stale entry
# fails the gate too: remove it with the fix's oracle commit.

# Specified rules, edges, and messages no gated test reaches, and why.
#
# Each test's verdicts pass a rule nothing triggered, so only the suite as a whole
# can say a rule was ever tested. The assurance gate requires the gated tests
# together to reach everything the specification declares except what is listed
# here: a change that stops reaching an item fails the gate, and a test that starts
# reaching a listed item makes its entry stale, which fails the gate too until the
# entry goes. This list is what a receipt does not prove.

[[unreached]]
items = ["start_run: abandoned", "start_run: unavailable"]
reason = """A command for an REE whose store no workbench serves is refused before it is sent \
(store_unavailable), and a workbench answers a start at once, so a start goes unanswered only when \
the connection drops between routing and the answer, a window no fault can be aimed at."""

[[unreached]]
items = ["Attempt pending -> capture_failed"]
reason = """Needs the before-snapshot to fail, which it does only when the REE changed outside \
any attempt while its history cannot be written: a failed capture rolls back, so the faults \
tier's locked history never leaves such a change. Core's unit tests take it."""

[[unreached]]
items = ["Attempt executing -> capture_failed"]
reason = """Needs the attempt's record to fail to be written a moment after the same record was \
written, before the handler starts; no fault can be aimed at that. Core's unit tests take it."""

[[unreached]]
items = ["start_run: error", "follow_run: error"]
reason = """Needs a workbench that answers a start or a follow with a transport or protocol \
error; no tier makes one."""

[[unreached]]
items = ["follow_run: unknown"]
reason = """Needs a command its workbench never started, followed: the API follows only what was \
accepted, from a store that keeps its executions. The supervisor's unit tests take it."""

[[unreached]]
items = ["Execution adopted -> adopted", "Execution adopted -> lost", "Execution adopted -> stopped"]
reason = """Needs a second fault during a command a restarted workbench took over: a restart, a \
crash, or a cancel. The gated tiers inject one fault per command; the workbench's unit tests take \
adoption and its endings."""

[[unreached]]
items = [
  "AuthorApiAction canceling -> resumed",
  "AuthorApiAction resumed -> canceled",
  "AuthorApiAction resumed -> canceling",
  "AuthorApiAction resumed -> failed",
  "AuthorApiAction resumed -> resumed",
]
reason = """The API crash is staged during a build that then succeeds: a cancel around the crash, a \
failing resumed build, or a second crash needs a second fault the gated tiers do not stage. The \
API's unit tests take resuming."""

[[unreached]]
items = [
  "AuthorApiAction requested -> canceling",
  "AuthorApiAction canceling -> succeeded",
  "AuthorApiAction canceling -> failed",
]
reason = """Cancellation is exercised only while a build runs, where the canceled build \
settles canceled; canceling before a worker starts, or work finishing after the cancel, \
needs a race the gated tiers do not stage."""

[[unreached]]
items = ["cancel_run: error", "cancel_run: abandoned"]
reason = """A cancel is sent only while its command runs on a connected workbench, which takes \
it at once; an error or a lost connection between sending it and the answer needs a race \
the gated tiers do not stage."""
