# The components that own entities or take part in boundaries, and the process
# each runs in. A process journal speaks for the components it hosts.

[[component]]
name = "api"
process = "api"
summary = "HTTP control plane: accepts requests and owns background runs."

[[component]]
name = "supervisor"
process = "api"
summary = "Library inside the API process: routes each REE to its store's workbench and dispatches commands."

[[component]]
name = "workbench"
process = "workbench"
summary = "The service serving a store of REEs: receives commands, starts an executor for each, and journals what became of it."

[[component]]
name = "core"
process = "executor"
summary = "Domain logic run by repo2ree-exec, one process per command the workbench starts: owns the REE and its history."
