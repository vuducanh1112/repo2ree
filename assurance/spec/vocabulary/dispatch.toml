# The words for typed command dispatch from the supervisor to a workbench.
#
# Recorded on the sender's side: the supervisor journals each request before it
# is sent and the one outcome it observed. The workbench side is not journaled
# yet; the Attempt machine is the receiver's evidence. Its rules are
# boundaries/dispatch.toml.

name = "dispatch"
kind = "boundary"
sender = "supervisor"
receiver = "workbench"
key = "attempt_id"
partition = "ree_id"
summary = "One typed command sent to a workbench and the single outcome the sender observed."
request = "exec_action"
responses = ["result", "unavailable", "error"]

[messages]
exec_action = "The command envelope, sent over the workbench's connection."
result = "The executor's terminal ActionResult frame."
unavailable = "The workbench reported that it cannot run commands."
error = "The workbench reported a transport or protocol error."

[facts.exec_action]
operation = "str"
run_id = "str"

[facts.result]
# The commit that captured the attempt, as the result reported it.
commit = "str?"

[facts.result.status]
type = "str"
required = true

[facts.result.status.values]
succeeded = "The command did what it was asked."
failed = "The command could not do it."
canceled = "The command stopped because its run was canceled."
