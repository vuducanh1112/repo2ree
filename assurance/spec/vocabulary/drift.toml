# The words for an REE changing outside ree, between its attempts: an editor saving one of its files, a disk failing,
# another program writing it, or git committing to its history, resetting it or rewriting it; in the REE itself or in
# a review of it. Nothing in the product makes one; whatever acts on the REE from outside does, and
# records it in its own journal. The product's part is to notice it, which its attempts record (Attempt's
# drift_found). Its machine is entities/drift.toml.

name = "Drift"
kind = "entity"
owner = "environment"
key = "drift_id"
partition = "ree_id"
evidence = "journal"
summary = "One file of an REE or its reviews changed, added or removed, or one ref of a history moved, outside ree."

[states]
arisen = "The file or ref is not as the REE's last attempt left it."
undone = "The environment put it back as the REE's last attempt left it."

[facts]
# The file, by its path from the REE: reviews/<id>/... for a review's; .git/<ref> for a ref of a history.
path = "str"

[facts.part]
type = "str"
required_in = ["arisen"]

[facts.part.values]
overlay = "A script as the REE writes it."
workspace = "A file of the workspace laid out from the source and the overlay. What else the workspace holds is the experiment environment and outputs, which receipts vouch for, or recorded nowhere, so none of it drifts."
records = "Any other file the REE's history holds."
history = "A ref of the history: committed to, reset or rewritten."
