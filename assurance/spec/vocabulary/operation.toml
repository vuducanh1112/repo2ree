# The words for the commands core runs on an REE, and on a review of one. Each has one
# name here, and every interface spells it from this one. A review operation reproduces
# the operation its name ends in.

name = "Operation"
kind = "catalogue"
summary = "Every command core runs, on an REE or on a review of one."

[operations]
initialize_ree = "Start a new REE: its definition, its scripts, and the first commit of its history."
acquire_source = "Fetch the source from its origin, or take it from an archive, and freeze it."
remove_source = "Remove the frozen source, keeping the scripts and the definition."
load_ree_bundle = "Replace the REE with a bundle, sealed or draft, its receipts included."
patch_ree_definition = "Change the REE's declarations: its name, catalog entry, experiment environment and experiments, whose scripts come and go with them."
write_script = "Overwrite one of the REE's scripts: each always has one."
suggest_scripts = "Propose build experiment environment and activation scripts from the source and the machine."
lint_scripts = "Check the REE's scripts."
evaluate_reproducibility = "Assess how fully the source pins its dependencies."
observe_hardware = "Record the hardware the machine offers."
check_working_environment = "Run the author's check that the working environment offers what the scripts need."
materialize_workspace = "Assemble the workspace afresh from the source and the REE's scripts, undoing whatever changed it."
build_experiment_environment = "Build the experiment environment with the build experiment environment script."
generate_sbom = "List the software in the built experiment environment."
cross_check_sbom = "Compare the dependencies the source declares with the SBOM."
activate_experiment_environment = "Run the activate experiment environment script alone: it enters the experiment environment and hands over."
run_experiment = "Run one declared experiment and verify its outputs."
seal_ree = "Freeze the REE and its evidence under one digest: nothing changes after this."

[review_operations]
review_acquire_source = "Open a review: acquire the source the author pinned, from its origin or from the REE's own snapshot."
review_build_experiment_environment = "Rebuild the experiment environment from the review's source, or certify the one the REE ships."
review_activate_experiment_environment = "Run the author's activate experiment environment script alone, in the review's workspace."
review_run_experiment = "Reproduce one experiment in the review, and compare its outputs with the author's."
