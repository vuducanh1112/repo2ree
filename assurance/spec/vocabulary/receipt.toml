# The words for one receipt: whether the evidence an author step produced still speaks
# for the REE, as core's audit reports it around each attempt
# (core/domain/ree/audit.py). The checker turns differences between audits into
# transitions. It has no machine: any standing may follow any other, so only the
# invariants say who may change one.

name = "Receipt"
kind = "entity"
owner = "core"
key = "step_id"
partition = "ree_id"
evidence = "git"
summary = "One step's receipt, and whether it still speaks for the REE as it now stands."

[states]
missing = "Applicable, and no receipt: the step has not run successfully."
current = "The receipt still matches everything it rests on."
stale = "A receipt exists, but something it rests on moved or was removed."
not_applicable = "Nothing is declared for this step to be about, and there is no receipt."

[facts]
# A receipt's kind, or run_experiment:<name>.
step = "str"
operation = { type = "str?", catalogue = ["operations"] }
attempt_id = "str?"

# The step without the experiment name.
[facts.kind]
type = "str"
required = true

[facts.kind.values]
acquire_source = "The frozen source."
evaluate_reproducibility = "The reproducibility evaluation."
observe_hardware = "The observed hardware."
check_working_environment = "The author's check of the working environment."
build_experiment_environment = "The built experiment environment."
generate_sbom = "The experiment environment's SBOM."
cross_check_sbom = "Declared dependencies checked against the SBOM."
activate_experiment_environment = "The activation, run alone: it enters the experiment environment and hands over."
run_experiment = "One declared experiment, run."

[facts.cause]
type = "str"

[facts.cause.values]
operation = "An attempt changed the standing."
external = "The standing changed between attempts."
baseline = "The standing as first audited, before any attempt."
