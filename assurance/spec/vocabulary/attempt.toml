# The words for one execution attempt of a typed command inside an REE.
#
# Core is the owner and the REE's Git history is its journal: capture_command
# rewrites the attempt's record at every phase and publishes the final record as
# a commit. The checker reads those records rather than a separate event file
# (repo2ree_assurance_checker.sources). Its machine is entities/attempt.toml.

name = "Attempt"
kind = "entity"
owner = "core"
key = "attempt_id"
partition = "ree_id"
evidence = "git"
summary = "One command execution inside an REE, from its pending record to its published capture."

[states]
pending = "The attempt record exists; the before-snapshot is not taken yet."
executing = "The before-snapshot was taken and the handler was started."
completed = "The handler returned an outcome; the after-state is not published yet."
captured = "The outcome and after-state are published as a commit."
capture_failed = "Recording failed; the REE files were rolled back to the before-snapshot, if one was taken and the restore worked."

[facts]
run_id = "str"
scope = "str"
# The journal record of the request that started this attempt (see boundaries/start_run.toml).
# Absent for an attempt nothing started, such as one run in-process.
dispatched_by = "str?"
commit = { type = "str", required_in = ["captured"] }
changed = { type = "bool", required_in = ["captured"] }
error = "str"
# A record that failed to be captured stays beside the history, not in a commit: its identity is
# the digest of its bytes ("sha256:<hex>"), which the dispatch result names as it names a commit.
record = { type = "str", required_in = ["capture_failed"] }
# Every file of the REE that had drifted when the attempt began, by its path from the REE; and the one script edit,
# in the overlay, that the attempt records of it. An attempt that found drift and records none of it is refused.
drift_found = "[str]"
drift_recorded = "str?"

[facts.outcome]
type = "str"
required_in = ["completed"]

[facts.outcome.values]
succeeded = "The command did what it was asked."
failed = "The command could not do it."
canceled = "The command stopped because its run was canceled."
interrupted = "The executor ended without reporting; the REE files were rolled back to the before-snapshot."

# The command core ran: one of the catalogue's operations, on the REE or on a review of it.
[facts.operation]
type = "str"
catalogue = ["operations", "review_operations"]
