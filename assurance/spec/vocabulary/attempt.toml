# The words for one execution attempt of a typed command inside an REE.
#
# Core is the owner and the REE's Git history is its journal: capture_command
# rewrites the attempt's record at every phase and publishes the final record as
# a commit. The checker reads those records rather than a separate event file
# (repo2ree_assurance_checker.sources). Its machine is entities/attempt.toml.

name = "Attempt"
kind = "entity"
owner = "core"
key = "attempt_id"
partition = "ree_id"
evidence = "git"
summary = "One command execution inside an REE, from its pending record to its published capture."

[states]
pending = "The attempt record exists; the before-snapshot is not taken yet."
executing = "The before-snapshot was taken and the handler was started."
completed = "The handler returned an outcome; the after-state is not published yet."
captured = "The outcome and after-state are published as a commit."
capture_failed = "Recording failed; the REE files were not rolled back."

[facts]
run_id = "str"
scope = "str"
# The journal record of the request that dispatched this attempt (see boundaries/dispatch.toml).
# Absent for an attempt nothing dispatched, such as one run in-process.
dispatched_by = "str?"
commit = { type = "str", required_in = ["captured"] }
changed = { type = "bool", required_in = ["captured"] }
error = "str"

[facts.outcome]
type = "str"
required_in = ["completed"]

[facts.outcome.values]
succeeded = "The command did what it was asked."
failed = "The command could not do it."
canceled = "The command stopped because its run was canceled."

# The command core ran: one of the typed commands the product dispatches into an REE.
[facts.operation]
type = "str"

[facts.operation.values]
acquire_source = "Fetch or receive the source and freeze it."
remove_source = "Remove the frozen source."
patch_ree_definition = "Change the REE's declarations."
write_file = "Create or overwrite a file in the REE's overlay."
delete_file = "Delete a file from the REE's overlay."
generate_script_candidates = "Suggest build and activation scripts."
lint_scripts = "Check the REE's scripts."
evaluate_dependency_score = "Assess how reproducible the source's dependencies are."
generate_hbom = "Record the hardware the REE runs on."
build_runtime = "Build the runtime with the build script."
generate_sbom = "List what the built runtime contains."
cross_check_sbom = "Compare the declared dependencies with the SBOM."
activation_test = "Check that the runtime activates."
run_experiment = "Run one declared experiment and verify its outputs."
seal_ree = "Freeze the REE."
load_ree_bundle = "Restore an REE from a bundle, its receipts included."
materialize_workspace = "Merge the upstream source and the overlay into the workspace."
review_acquire_source = "A reviewer reproduces the source."
review_build_runtime = "A reviewer reproduces the runtime build."
review_activation_test = "A reviewer reproduces the activation test."
review_run_experiment = "A reviewer reproduces one experiment."
