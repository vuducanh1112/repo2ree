# The REE document (ree.json per capture commit), one machine per part. A move no edge allows violates the rule aggregate:Ree.

name = "Ree"
summary = "One author REE: what it declares, what its receipts prove, and whether it is sealed."
created_by = "initialize_ree"
restored_by = "load_ree_bundle"
writes_nothing = ["suggest_scripts", "lint_scripts", "materialize_workspace"]
receipt_entity = "Receipt"
# The REE's authored files: its scripts, each the field's that declares it, and nothing else. A
# write_script changes a file and the field claiming it together; an experiment's files, named by
# its slug, come and go with it.
overlay = "overlay/"
# The REE's file tree, as the contract states it: every file a capture commits is an entry of it, and is stored
# as the entry says, git or LFS. Read from the repository root.
tree = "contracts/ree/layout.json"

[lifecycle]
initial = "draft"

[[lifecycle.transitions]]
from = "draft"
to = "sealed"
by = ["seal_ree", "load_ree_bundle"]
why = "Loading a sealed bundle restores its seal."

[fields."definition.name"]
group = "catalog"
initial = "set"
change = ["patch_ree_definition"]

# Every member of the catalog entry: what the REE says of itself, changed only by declaring it.
[fields."definition.catalog.*"]
group = "catalog"
initial = "unset"
set = ["patch_ree_definition"]
change = ["patch_ree_definition"]
clear = ["patch_ree_definition"]

[fields."definition.source"]
group = "acquire_source"
initial = "unset"
set = ["acquire_source"]
clear = ["remove_source"]

[fields."definition.hbom"]
group = "observe_hardware"
initial = "unset"
set = ["patch_ree_definition"]
change = ["patch_ree_definition"]
clear = ["patch_ree_definition"]

[fields."definition.experiment_environment"]
group = "build_experiment_environment"
initial = "set"
set = ["patch_ree_definition"]
change = ["patch_ree_definition", "write_script"]
files = ["ree-scripts/build_experiment_environment.sh"]

[fields."definition.experiment_environment.artifact_path"]
group = "build_experiment_environment"
initial = "unset"
set = ["patch_ree_definition"]
change = ["patch_ree_definition"]
clear = ["patch_ree_definition"]

# The one way into the experiment environment: the activation runs it alone, and every experiment through it.
[fields."definition.activate_experiment_environment"]
group = "activate_experiment_environment"
initial = "set"
set = ["patch_ree_definition"]
change = ["patch_ree_definition", "write_script"]
files = ["ree-scripts/activate_experiment_environment.sh"]

# How each script is launched, a Slurm job step for instance; every REE starts with one that runs them directly.
[fields."definition.launch"]
group = "launch"
initial = "set"
set = ["patch_ree_definition"]
change = ["patch_ree_definition", "write_script"]
files = ["ree-scripts/launch.sh"]

# The author's check that the working environment offers what the scripts need: every REE starts with one that
# passes, which the author edits.
[fields."definition.check_working_environment"]
group = "check_working_environment"
initial = "set"
set = ["patch_ree_definition"]
change = ["patch_ree_definition", "write_script"]
files = ["ree-scripts/check_working_environment.sh"]

[fields."definition.experiments[*]"]
group = "run_experiment"
set = ["patch_ree_definition"]
change = ["patch_ree_definition", "write_script"]
clear = ["patch_ree_definition"]
files = ["ree-scripts/experiments/{slug}.sh", "ree-scripts/experiments/{slug}.verify.sh"]

[fields."contents"]
group = "bundle"
initial = "unset"
set = ["seal_ree"]
clear = ["remove_source"]

[fields."capture"]
group = "bundle"
initial = "set"
change = ["seal_ree"]

# ---- Receipts ------------------------------------------------------------------------------------
#
# A receipt is current exactly when it is applicable and every pair of its basis agrees: the value it
# recorded, and the value of what that pair names in the same commit. What it rests on and is made
# from are read off its basis.
#
#   applicable  receipt  basis agrees  standing
#   no          no       -             not_applicable
#   yes         no       -             missing
#   yes         yes      yes           current
#   yes         yes      no            stale
#   no          yes      -             stale (orphaned)

[receipts.acquire_source]
about = ["definition.source"]
basis = [
    { recorded = "origin_url", now = "definition.source.origin_url" },
    { recorded = "source_type", now = "definition.source.source_type" },
    { recorded = "requested_ref", now = "definition.source.requested_ref" },
]
cleared_by = ["remove_source"]

# The evaluation reads the dependencies the source declares, and nothing beside it.
[receipts.evaluate_reproducibility]
about = ["definition.source"]
basis = [{ recorded = "snapshot_digest", now = "receipts.acquire_source.snapshot_digest" }]
cleared_by = ["remove_source"]

[receipts.observe_hardware]
about = ["definition.hbom"]
applies_without_declaration = true
basis = []

# The check, run in the working environment; it rests on no source, so removing the source keeps it.
[receipts.check_working_environment]
about = ["definition.check_working_environment"]
basis = [
    { recorded = "check_working_environment_script_digest", now = "definition.check_working_environment.check_working_environment_script_digest" },
    { recorded = "launch_script_digest", now = "definition.launch.launch_script_digest" },
]

[receipts.build_experiment_environment]
about = ["definition.experiment_environment.artifact_path"]
basis = [
    { recorded = "snapshot_digest", now = "receipts.acquire_source.snapshot_digest" },
    { recorded = "build_experiment_environment_script_digest", now = "definition.experiment_environment.build_experiment_environment_script_digest" },
    { recorded = "artifact_path", now = "definition.experiment_environment.artifact_path" },
    { recorded = "launch_script_digest", now = "definition.launch.launch_script_digest" },
]
cleared_by = ["remove_source"]

[receipts.generate_sbom]
about = ["definition.experiment_environment.artifact_path"]
basis = [
    { recorded = "experiment_environment_digest", now = "receipts.build_experiment_environment.produced_artifact_digest" },
]
cleared_by = ["remove_source"]

[receipts.cross_check_sbom]
about = ["definition.source", "definition.experiment_environment.artifact_path"]
basis = [
    { recorded = "sbom_digest", now = "receipts.generate_sbom.sbom_digest" },
    { recorded = "report_digest", now = "receipts.evaluate_reproducibility.report_digest" },
]
cleared_by = ["remove_source"]

# The activation run alone, around a command that does nothing: it enters the experiment environment and hands over.
[receipts.activate_experiment_environment]
about = ["definition.activate_experiment_environment"]
basis = [
    { recorded = "snapshot_digest", now = "receipts.acquire_source.snapshot_digest" },
    { recorded = "experiment_environment_digest", now = "receipts.build_experiment_environment.produced_artifact_digest" },
    { recorded = "activate_experiment_environment_script_digest", now = "definition.activate_experiment_environment.activate_experiment_environment_script_digest" },
    { recorded = "launch_script_digest", now = "definition.launch.launch_script_digest" },
]
cleared_by = ["remove_source"]

# An experiment runs inside the activation, in the environment the activation entered: only while both
# still stand as it found them.
[receipts.run_experiment]
keyed = true
at = "receipts.experiments"
about = ["definition.experiments[*]"]
basis = [
    { recorded = "snapshot_digest", now = "receipts.acquire_source.snapshot_digest" },
    { recorded = "experiment_environment_digest", now = "receipts.build_experiment_environment.produced_artifact_digest" },
    { recorded = "experiment_environment_digest", now = "receipts.activate_experiment_environment.experiment_environment_digest" },
    { recorded = "activate_experiment_environment_script_digest", now = "receipts.activate_experiment_environment.activate_experiment_environment_script_digest" },
    { recorded = "activate_experiment_environment_script_digest", now = "definition.activate_experiment_environment.activate_experiment_environment_script_digest" },
    { recorded = "run_script_digest", now = "definition.experiments[$name].run_script_digest" },
    { recorded = "verify_script_digest", now = "definition.experiments[$name].verify_script_digest" },
    { recorded = "launch_script_digest", now = "definition.launch.launch_script_digest" },
]
cleared_by = ["remove_source"]
