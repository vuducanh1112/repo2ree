# The REE document (ree.json per capture commit), one machine per part. A move no edge allows violates the rule aggregate:Ree.

name = "Ree"
summary = "One author REE: what it declares, what its receipts prove, and whether it is sealed."
created_by = "initialize_ree"
restored_by = "load_ree_bundle"
writes_nothing = ["generate_script_candidates", "lint_scripts"]
receipt_entity = "Receipt"
# The REE's authored files: its scripts, each the field's that declares it, and nothing else. A
# write_file or delete_file changes a file and the field claiming it together. An experiment's
# files are named by its slug, and may be authored before the experiment is declared.
overlay = "overlay/"

[lifecycle]
initial = "draft"

[[lifecycle.transitions]]
from = "draft"
to = "sealed"
by = ["seal_ree", "load_ree_bundle"]
why = "Loading a sealed bundle restores its seal."

[fields."definition.name"]
group = "catalog"
initial = "set"
change = ["patch_ree_definition"]

[fields."definition.catalog.description"]
group = "catalog"
initial = "unset"
set = ["patch_ree_definition"]
change = ["patch_ree_definition"]
clear = ["patch_ree_definition"]

[fields."definition.catalog.version"]
group = "catalog"
initial = "unset"
set = ["patch_ree_definition"]
change = ["patch_ree_definition"]
clear = ["patch_ree_definition"]

[fields."definition.catalog.website"]
group = "catalog"
initial = "unset"
set = ["patch_ree_definition"]
change = ["patch_ree_definition"]
clear = ["patch_ree_definition"]

[fields."definition.catalog.keywords"]
group = "catalog"
initial = "unset"
set = ["patch_ree_definition"]
change = ["patch_ree_definition"]
clear = ["patch_ree_definition"]

[fields."definition.catalog.contributors"]
group = "catalog"
initial = "unset"
set = ["patch_ree_definition"]
change = ["patch_ree_definition"]
clear = ["patch_ree_definition"]

[fields."definition.catalog.corresponding_author_identifier"]
group = "catalog"
initial = "unset"
set = ["patch_ree_definition"]
change = ["patch_ree_definition"]
clear = ["patch_ree_definition"]

[fields."definition.source"]
group = "source"
initial = "unset"
set = ["acquire_source"]
clear = ["remove_source"]

[fields."definition.hardware"]
group = "hardware"
initial = "unset"
set = ["patch_ree_definition"]
change = ["patch_ree_definition"]
clear = ["patch_ree_definition"]

[fields."definition.experiment_environment"]
group = "experiment_environment"
initial = "set"
set = ["patch_ree_definition"]
# The build experiment environment script is never deleted (only a verify script is), so only writing it changes the build.
change = ["patch_ree_definition", "write_file"]
clear = ["patch_ree_definition"]
files = ["ree-scripts/build_experiment_environment.sh"]

[fields."definition.experiment_environment.artifact_path"]
group = "experiment_environment"
initial = "unset"
set = ["patch_ree_definition"]
change = ["patch_ree_definition"]
clear = ["patch_ree_definition"]

# The one way into the experiment environment: the test activation and every experiment run through it.
[fields."definition.activate_experiment_environment"]
group = "activate_experiment_environment"
initial = "set"
set = ["patch_ree_definition"]
change = ["patch_ree_definition", "write_file"]
clear = ["patch_ree_definition"]
files = ["ree-scripts/activate_experiment_environment.sh"]

# The workbench environment the author's scripts run in: the build, activation and experiments.
[fields."definition.workbench_environment"]
group = "workbench_environment"
initial = "unset"
set = ["patch_ree_definition"]
change = ["patch_ree_definition"]
clear = ["patch_ree_definition"]

[fields."definition.test_activation"]
group = "test_activation"
initial = "set"
set = ["patch_ree_definition"]
change = ["patch_ree_definition", "write_file", "delete_file"]
clear = ["patch_ree_definition"]
files = ["ree-scripts/test_activation.sh", "ree-scripts/test_activation.verify.sh"]

[fields."definition.experiments[*]"]
group = "experiment"
set = ["patch_ree_definition"]
change = ["patch_ree_definition", "write_file", "delete_file"]
clear = ["patch_ree_definition"]
files = ["ree-scripts/experiments/{slug}.sh", "ree-scripts/experiments/{slug}.verify.sh"]

[fields."contents"]
group = "bundle"
initial = "unset"
set = ["seal_ree"]
clear = ["remove_source"]

[fields."capture"]
group = "bundle"
initial = "set"
change = ["seal_ree"]

[receipts.source]
about = ["definition.source"]
rests_on = ["definition.source"]
produced_by = "acquire_source"
cleared_by = ["remove_source"]

[receipts.evaluation]
about = ["definition.source"]
made_from = ["source"]
produced_by = "evaluate_dependency_score"
cleared_by = ["remove_source"]

[receipts.hardware]
about = ["definition.hardware"]
applies_without_declaration = true
produced_by = "generate_hbom"

[receipts.experiment_environment]
about = ["definition.experiment_environment.artifact_path"]
rests_on = ["definition.experiment_environment", "definition.workbench_environment"]
made_from = ["source"]
produced_by = "build_experiment_environment"
cleared_by = ["remove_source"]

[receipts.sbom]
about = ["definition.experiment_environment.artifact_path"]
made_from = ["experiment_environment"]
produced_by = "generate_sbom"
cleared_by = ["remove_source"]

[receipts.sbom_cross_check]
about = ["definition.source", "definition.experiment_environment.artifact_path"]
made_from = ["sbom", "evaluation"]
produced_by = "cross_check_sbom"
cleared_by = ["remove_source"]

[receipts.test_activation]
about = ["definition.test_activation"]
rests_on = ["definition.test_activation", "definition.activate_experiment_environment", "definition.workbench_environment"]
made_from = ["source", "experiment_environment"]
produced_by = "activation_test"
cleared_by = ["remove_source"]

[receipts.experiment]
keyed = true
about = ["definition.experiments[*]"]
rests_on = ["definition.experiments[*]", "definition.activate_experiment_environment", "definition.workbench_environment"]
made_from = ["source", "experiment_environment"]
produced_by = "run_experiment"
cleared_by = ["remove_source"]
