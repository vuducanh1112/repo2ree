# Cross-entity behaviour. Each invariant uses one fixed pattern (Invariant in repo2ree_assurance_checker.spec).

# ---- Control plane ------------------------------------------------------------

[[invariant]]
id = "follow-success-is-captured"
pattern = "requires"
summary = "A command is reported to have succeeded only once a captured, successful attempt backs it."
when = { boundary = "follow_run", message = "settled", where = { status = "succeeded" } }
require = { entity = "Attempt", key_from = "$key", reached = "captured", where = { outcome = "succeeded" }, order = "before" }

# A workbench answers that it started a command only when it did.
[[invariant]]
id = "accepted-runs-started"
pattern = "requires"
summary = "A workbench accepts a command only when it started an executor for it."
when = { boundary = "start_run", message = "accepted" }
require = { entity = "Execution", key_from = "$key", reached = "started" }

# An attempt's capture and rollback cover the whole REE, so two attempts in one REE at once would
# undo each other's work: an executor holds its REE until it ends.
[[invariant]]
id = "one-execution-per-ree"
pattern = "excludes"
summary = "A workbench starts an executor only while no other runs in the same REE."
when = { entity = "Execution", to = "started" }
require = { entity = "Execution", in_states = ["started", "adopted"] }

# An executor that vanished leaves its attempt to the workbench, which has core roll it back.
[[invariant]]
id = "lost-executions-settle-their-attempt"
pattern = "requires"
summary = "An executor found gone has its attempt captured as interrupted, or its capture failed."
when = { entity = "Execution", to = "lost" }
require = { entity = "Attempt", key_from = "$key", reached = ["captured", "capture_failed"] }

# Canceling or interrupting an attempt rolls the REE back to its before-snapshot: the capture
# commit's tree is the tree it started from.
[[invariant]]
id = "canceled-attempts-change-nothing"
pattern = "guard"
summary = "A canceled or interrupted attempt is captured with the REE as it was before the attempt."
when = { entity = "Attempt", to = "captured", where = { outcome = { in = ["canceled", "interrupted"] } } }
require = { where = { changed = false } }

# A store is served by one workbench at a time: a second one claiming it is refused, never
# let in beside the first, so the store's commands always have one place to go.
[[invariant]]
id = "one-session-per-store"
pattern = "excludes"
summary = "A workbench is admitted to a store only while no other session serves it."
when = { entity = "WorkbenchSession", to = "connected" }
require = { entity = "WorkbenchSession", in_states = ["connected"] }

# A workbench stops an executor only because a cancel asked it to: a caller that went away,
# a session that ended, or a restart is not a reason to stop the command it started.
[[invariant]]
id = "executions-stop-only-on-cancel"
pattern = "guard"
summary = "A workbench stops a running executor only because a cancel asked it to."
when = { entity = "Execution", to = "stopped" }
require = { where = { cause = "cancel" } }

[[invariant]]
id = "canceled-executions-were-asked-to-stop"
pattern = "requires"
summary = "An executor stopped by a cancel was stopped after the supervisor sent that cancel."
when = { entity = "Execution", to = "stopped", where = { cause = "cancel" } }
require = { boundary = "cancel_run", message = "cancel_run", key_from = "$key", order = "before" }

# ---- The author, through the API ----------------------------------------------
#
# What the author is told against what happened. An action that runs a command in
# the REE names the attempt that ran it (attempt_id).

[[invariant]]
id = "api-success-is-recorded"
pattern = "requires"
summary = "The author is told an action on the REE succeeded only after its attempt was recorded as succeeded."
when = { entity = "AuthorApiAction", to = "succeeded", where = { action = { group = ["source", "editing", "assistance", "evidence", "lifecycle"] } } }
require = { entity = "Attempt", key_from = "attempt_id", reached = "captured", where = { outcome = "succeeded" }, order = "before" }

# A failed or canceled action that got as far as an attempt names it, and that
# attempt settled first: a cancel ends the attempt, it does not kill it. One that
# failed before any attempt existed names none.
[[invariant]]
id = "settled-api-actions-settle-their-attempt"
pattern = "requires"
summary = "The author is told an action failed or was canceled only after its attempt settled."
when = { entity = "AuthorApiAction", to = ["failed", "canceled"], where = { attempt_id = { not = "" } } }
require = { entity = "Attempt", key_from = "attempt_id", reached = ["captured", "capture_failed"], order = "before" }

# ---- REE domain ---------------------------------------------------------------

[[invariant]]
id = "ree-changes-through-operations"
pattern = "guard"
summary = "The committed REE changes only through dispatched operations, never between them."
when = { entity = "Ree", from = "draft", to = ["draft", "sealed"] }
require = { where = { cause = "operation" } }

# A Ree transition is witnessed only where the committed tree changed, so any
# transition out of sealed is a change to a sealed REE.
[[invariant]]
id = "sealed-rees-are-frozen"
pattern = "excludes"
summary = "A sealed REE's committed tree never changes again."
when = { entity = "Ree", to = ["draft", "sealed"] }
require = { entity = "Ree", in_states = ["sealed"] }

# Evidence an attempt brings into being is that attempt's work: it exists only if the
# attempt succeeded, and only if it is the work that produces that kind of evidence. A
# bundle load restores evidence of every kind. The operation and outcome are the
# attempt's own record, not what the receipt repeats of them. Evidence going stale and
# current again is not appearing: an edit can do that.
[[invariant]]
id = "receipts-come-from-their-producers"
pattern = "requires"
summary = "Evidence appears only through a successful attempt of an operation that produces it."
when = { entity = "Receipt", from = ["(none)", "missing", "not_applicable"], to = ["current", "stale"], where = { cause = "operation" } }

[invariant.require]
entity = "Attempt"
key_from = "attempt_id"
reached = "captured"
order = "before"

[invariant.require.where]
outcome = "succeeded"

[invariant.require.where.operation]
per = "kind"

[invariant.require.where.operation.in]
source = ["acquire_source", "load_ree_bundle"]
evaluation = ["evaluate_dependency_score", "load_ree_bundle"]
hardware = ["generate_hbom", "load_ree_bundle"]
runtime = ["build_runtime", "load_ree_bundle"]
sbom = ["generate_sbom", "load_ree_bundle"]
sbom_cross_check = ["cross_check_sbom", "load_ree_bundle"]
test_activation = ["activation_test", "load_ree_bundle"]
experiment = ["run_experiment", "load_ree_bundle"]

[[invariant]]
id = "sealed-without-stale-evidence"
pattern = "excludes"
summary = "An REE is never sealed while any of its receipts is stale."
when = { entity = "Ree", from = "draft", to = "sealed" }
require = { entity = "Receipt", in_states = ["stale"] }
