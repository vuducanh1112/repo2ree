# The Execution machine: where an instance starts, which edges it may take, and when it
# must have settled. Its states and facts are declared in vocabulary/execution.toml.

name = "Execution"
initial = "started"
terminal = ["exited", "stopped", "lost"]
# An executor outlives the workbench process that started it, but a store closed for good runs none.
settles_before_close = "final"
# A workbench process that starts serving a store takes over every executor the last one left
# running, or settles it, before that process's journal closes.
reconciled_by = ["adopted", "exited", "stopped", "lost"]

[[transitions]]
from = "started"
to = ["adopted", "exited", "stopped", "lost"]
why = "The executor ends by itself, after a cancel asked it to stop, or was gone when a restarted workbench looked; or a restarted workbench takes it over."

[[transitions]]
from = "adopted"
to = ["adopted", "exited", "stopped", "lost"]
why = "An adopted executor ends as one the workbench started does, or is taken over again after another restart."
