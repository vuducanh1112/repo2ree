# The Allocation machine: where an instance starts, which edges it may take, and when it
# must have settled. Its states and facts are declared in vocabulary/allocation.toml.
#
# Each edge names the situation in the product that takes it; an edge no situation takes
# does not belong here, even where the supervisor's own table would allow it.

name = "Allocation"
initial = "requested"
terminal = ["released"]
# Allocations outlive the API process that holds them: a restart keeps those assigned
# and fails those it was still setting up. A final close (the owner will not resume)
# leaves no one to release them, so by then each must be released.
settles_before_close = "final"

[[transitions]]
from = "requested"
to = ["provisioning", "waiting_for_workbench"]
why = "Provider-managed allocations provision; externally managed ones wait for their bench."

[[transitions]]
from = "requested"
to = ["failed"]
why = "The API restarted before setting it up any further."

[[transitions]]
from = "provisioning"
to = ["waiting_for_workbench"]
why = "The provider started the bench, which now has to call home."

[[transitions]]
from = "provisioning"
to = ["failed"]
why = "The provider could not start the bench, or the API restarted meanwhile."

[[transitions]]
from = "waiting_for_workbench"
to = ["ready"]
why = "The bench called home."

[[transitions]]
from = "waiting_for_workbench"
to = ["failed"]
why = "The bench did not call home in time, or the API restarted meanwhile."

[[transitions]]
from = "ready"
to = ["assigned"]
why = "The REE was initialised on the bench."

[[transitions]]
from = "ready"
to = ["failed"]
why = "The REE could not be initialised on the bench, or the API restarted meanwhile."

[[transitions]]
from = "assigned"
to = ["draining"]
why = "The author released the REE's workbench."

[[transitions]]
from = "assigned"
to = ["lost"]
why = "The provider reports the bench gone."

[[transitions]]
from = "draining"
to = ["released"]
why = "The bench is torn down and the provider released it."

[[transitions]]
from = "draining"
to = ["failed"]
why = "The provider could not release the bench; releasing the REE again retries."

[[transitions]]
from = "failed"
to = ["draining"]
why = "A failed allocation is still released."

[[transitions]]
from = "lost"
to = ["draining"]
why = "A lost allocation is still released."
