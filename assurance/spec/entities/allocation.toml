# The Allocation machine: where an instance starts, which edges it may take, and when it
# must have settled. Its states and facts are declared in vocabulary/allocation.toml.

name = "Allocation"
initial = "requested"
terminal = ["released"]
# Allocations outlive the API process that holds them: a restart resumes them.
# A final close (the owner will not resume) leaves no one to release them, so
# by then each must be released.
settles_before_close = "final"

[[transitions]]
from = "requested"
to = ["provisioning", "waiting_for_workbench", "draining", "failed"]
why = "Provider-managed allocations provision; externally managed ones wait for their bench."

[[transitions]]
from = "provisioning"
to = ["waiting_for_workbench", "draining", "failed", "lost"]

[[transitions]]
from = "waiting_for_workbench"
to = ["ready", "draining", "failed", "lost"]

[[transitions]]
from = "ready"
to = ["assigned", "draining", "failed", "lost"]

[[transitions]]
from = "assigned"
to = ["draining", "failed", "lost"]

[[transitions]]
from = "draining"
to = ["released", "failed"]

[[transitions]]
from = "failed"
to = ["draining"]
why = "A failed allocation is still released."

[[transitions]]
from = "lost"
to = ["draining"]
why = "A lost allocation is still released."
