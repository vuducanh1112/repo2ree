[project]
name = "repo2ree-assurance-collector"
version = "0.1.0"
description = "Collect repo2ree behaviour evidence through the control plane into a dossier the checker reads."
requires-python = "~=3.13.0"
dependencies = ["pydantic~=2.11.7", "repo2ree-assurance-dossier"]

[tool.uv.sources]
repo2ree-assurance-dossier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_assurance_collector"]


[tool.importlinter]
include_external_packages = true
root_packages = [
    "repo2ree_assurance_collector", "repo2ree_assurance_dossier", "repo2ree_assurance_checker", "repo2ree_assurance_traceview", "repo2ree_api", "repo2ree_core",
    "repo2ree_docker", "repo2ree_executor", "repo2ree_provider_docker", "repo2ree_protocol",
    "repo2ree_supervisor", "repo2ree_workbench",
]

# A deployment is distributed: the collector reaches it over HTTP through the
# control plane, never by importing or reaching into the code that runs it.
[[tool.importlinter.contracts]]
name = "Collect stays independent of runtime packages"
type = "forbidden"
source_modules = ["repo2ree_assurance_collector"]
forbidden_modules = [
    "repo2ree_api", "repo2ree_core", "repo2ree_docker", "repo2ree_executor",
    "repo2ree_provider_docker", "repo2ree_protocol", "repo2ree_supervisor", "repo2ree_workbench",
]

# It writes the dossier format and knows nothing of what reads it: verifying
# and drawing are later steps on the dossier, never part of collecting it.
[[tool.importlinter.contracts]]
name = "Collect writes dossiers without verifying or drawing them"
type = "forbidden"
source_modules = ["repo2ree_assurance_collector"]
forbidden_modules = ["repo2ree_assurance_checker", "repo2ree_assurance_traceview"]

# And nothing the checker or its views do depends on how evidence was collected.
[[tool.importlinter.contracts]]
name = "Checker and views do not depend on collection"
type = "forbidden"
source_modules = ["repo2ree_assurance_checker", "repo2ree_assurance_traceview"]
forbidden_modules = ["repo2ree_assurance_collector"]
