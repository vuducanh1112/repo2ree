# The repository's zones: what each part is for, and which parts humans review.
#
# Every tracked file belongs to the zone of its longest matching entry (a directory
# ends in `/`; anything else names one file). A protected zone is what humans review:
# the specification decides what must hold, and the gates enforce it and issue the
# receipts. A commit that changes a protected zone changes nothing unprotected
# (the `spec-isolation` pre-commit hook), so a rule, its reading, its excuse, or a
# gate cannot be bent beside the code it judges. Everything else is changed freely
# and judged by the gates.
#
# `just repo-map` draws the zones, `just repo-map <path>` places one path, and
# `python scripts/zones.py verify` reports files no entry claims and entries that
# claim no file.

[spec]
summary = "What must hold, and how evidence is read against it."
protected = true

[spec.groups.behaviour]
summary = "Runtime behaviour as owned state machines."
[spec.groups.behaviour.paths]
"assurance/spec/" = "The vocabulary owners emit; machines, boundary rules, and cross-entity invariants"

[spec.groups.contract]
summary = "The vocabulary as published to the product, in no language of its own."
[spec.groups.contract.paths]
"contracts/behaviour/" = "The event schema generated by `just generate-behaviour`"

[spec.groups.checker]
summary = "Reads a dossier against the specification and gives verdicts."
[spec.groups.checker.paths]
"assurance/checker/" = "repo2ree_assurance_checker: evidence, replay, verdicts, and their views"

[spec.groups.excuses]
summary = "What the specification concedes is not proven, each with a reason."
[spec.groups.excuses.paths]
"assurance/checker/expected-verdicts.toml" = "Verdicts a gated test may leave open, and items no gated test reaches"

[gates]
summary = "What enforces the specification and writes receipts."
protected = true

[gates.groups.recipes]
summary = "The gates as you run them."
[gates.groups.recipes.paths]
"just/gates.just" = "`commit-gate`, `assurance-gate` and the tiers it runs, `publish-gate`"

[gates.groups.assurance]
summary = "Certifies a tree by its tests' outcomes, verdicts, and coverage."
[gates.groups.assurance.paths]
"scripts/gates/assurance_gate.py" = "Judges per-test runs and writes the assurance-gate receipt"
"scripts/tests/test_assurance_gate.py" = "Its tests"

[gates.groups.receipts]
summary = "The commit and publish gates, and the receipts every gate writes."
[gates.groups.receipts.paths]
"scripts/gates/receipts.py" = "The receipt every gate writes: one header, a body per gate, never tracked"
"scripts/gates/commit_gate.py" = "Binds a passing commit gate to the staged tree"
"scripts/gates/publish_gate.py" = "Binds a passing publish gate to an image set"
"scripts/tests/test_receipts.py" = "Its tests"
"scripts/tests/test_commit_gate.py" = "Its tests"
"scripts/tests/test_publish_gate.py" = "Its tests"
".receipts/" = "Where receipts are written (ignored, except this directory's rules)"

[gates.groups.guard]
summary = "Keeps protected zones apart from the rest."
[gates.groups.guard.paths]
"zones.toml" = "This file"
"scripts/zones.py" = "The pre-commit check, the map, and the completeness check"
"scripts/tests/test_zones.py" = "Its tests"
