# The repository's zones: what each part is for, and which parts humans review.
#
# Every tracked file belongs to the zone of its longest matching entry (a directory
# ends in `/`; anything else names one file). A protected zone is what humans review:
# the specification decides what must hold, and the gates enforce it and issue the
# certificates. A commit that changes a protected zone changes nothing unprotected
# (the `spec-isolation` pre-commit hook), so a rule, its reading, its excuse, or a
# gate cannot be bent beside the code it judges. Everything else is changed freely
# and judged by the gates.
#
# `just repo-map` draws the zones, `just repo-map <path>` places one path, and
# `python scripts/zones.py verify` reports files no entry claims and entries that
# claim no file.

[spec]
summary = "What must hold, and how evidence is read against it."
protected = true

[spec.groups.behaviour]
summary = "Runtime behaviour as owned state machines."
[spec.groups.behaviour.paths]
"specifications/" = "The vocabulary owners emit; machines, boundary rules, and cross-entity invariants"

[spec.groups.contract]
summary = "The vocabulary as published to the product, in no language of its own."
[spec.groups.contract.paths]
"contracts/behaviour/" = "The event schema generated by `just generate-behaviour`"

[spec.groups.checker]
summary = "Reads a recording against the specification and gives verdicts."
[spec.groups.checker.paths]
"conformance/" = "repo2ree_conformance: evidence, replay, verdicts, and their views"

[spec.groups.excuses]
summary = "What the specification concedes is not proven, each with a reason."
[spec.groups.excuses.paths]
"conformance/expected-verdicts.toml" = "Verdicts a gated test may leave open, and items no gated test reaches"
"conformance/tests/test_system_conformance.py" = "In-process scenarios; UNEXERCISED lists the edges they never reach"

[gates]
summary = "What enforces the specification and issues certificates."
protected = true

[gates.groups.behaviour]
summary = "Certifies a tree by its tests' outcomes, verdicts, and coverage."
[gates.groups.behaviour.paths]
"just/behaviour.just" = "`behaviour-gate`, the tiers it runs, `judge-e2e`, `repo-map`"
"scripts/publish/behaviour_gate.py" = "Judges per-test runs and writes the behaviour receipt"
"scripts/tests/test_behaviour_gate.py" = "Its tests"

[gates.groups.receipts]
summary = "The commit and publish gates, and the certificates they leave."
[gates.groups.receipts.paths]
"just/publish.just" = "`commit-gate`, `publish-gate`, and publishing"
"scripts/publish/commit_gate_stamp.py" = "Binds a passing commit gate to the staged tree"
"scripts/publish/publish_gate_receipt.py" = "Binds a passing publish gate to an image set"
"scripts/tests/test_commit_gate_stamp.py" = "Its tests"
"scripts/tests/test_publish_gate_receipt.py" = "Its tests"
".validation-certificates/" = "Where certificates are written (ignored, except this directory's rules)"

[gates.groups.guard]
summary = "Keeps protected zones apart from the rest."
[gates.groups.guard.paths]
"zones.toml" = "This file"
"scripts/zones.py" = "The pre-commit check, the map, and the completeness check"
"scripts/tests/test_zones.py" = "Its tests"
".pre-commit-config.yaml" = "The hooks: commit-gate certificate, spec isolation"

