[project]
name = "repo2ree-executor"
version = "0.1.0"
dependencies = [
    "repo2ree-core",
    "click~=8.2.1",
]

[tool.uv.sources]
repo2ree-core = { workspace = true }

[project.scripts]
repo2ree-exec = "repo2ree_executor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_executor"]
