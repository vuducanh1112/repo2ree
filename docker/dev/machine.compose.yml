# The dev container on an e2e machine, over docker-compose.dev.yml: the same service,
# with the checkout mounted at /repo2ree, built from the Nix dev image. It reaps what
# runs leave behind, outlives a reboot, and stays up for the runs that exec into it.
#
#   docker compose -f docker-compose.dev.yml -f docker/dev/machine.compose.yml up -d --build
services:
  dev:
    build:
      dockerfile: docker/dev/nix.Dockerfile
    init: true
    restart: unless-stopped
    command: ["sleep", "infinity"]
