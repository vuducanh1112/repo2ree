services:
  backend:
    image: ${REPO2REE_BACKEND_IMAGE:-docker.io/vuducanh1112/repo2ree-backend:edge}
    ports:
      - "8000:8000"
    volumes:
      - repo2ree-demo-data:/app/.repo2ree
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    image: ${REPO2REE_FRONTEND_IMAGE:-docker.io/vuducanh1112/repo2ree-frontend:edge}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      BACKEND_UPSTREAM: backend:8000

volumes:
  repo2ree-demo-data:
