services:
  backend:
    # `docker compose build` builds this; `make backend-image` produces the
    # same tag via a plain docker build for use outside compose.
    image: repo2ree-backend:latest
    build:
      context: .
      dockerfile: docker/demo/backend.Dockerfile
    environment:
      REVIEWS_STORAGE_DIR: ${DEMO_REVIEWS_STORAGE_DIR:-/app/.repo2ree/reviews}
    ports:
      - "8000:8000"
    volumes:
      - repo2ree-demo-data:/app/.repo2ree
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    # Built with Nix (single pinned toolchain shared with the dev shell and
    # workbench image), then loaded into the local Docker daemon:
    #   nix build .#frontend-image && docker load < result
    # Caddy serves the static bundle and reverse-proxies /api/* to the
    # backend, so the browser only ever talks to this one origin (:3000) and
    # there is no backend URL to configure — `docker compose up` just works.
    image: repo2ree-frontend:latest
    depends_on:
      - backend
    ports:
      - "3000:3000"
    # BACKEND_UPSTREAM defaults to the `backend` service name below, resolved
    # by the compose network. Override only for non-compose deployments.
    environment:
      BACKEND_UPSTREAM: backend:8000

volumes:
  repo2ree-demo-data:
