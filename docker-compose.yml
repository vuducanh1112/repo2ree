# Control plane only: GUI + backend. Workbench agents run separately
# (anywhere with a container runtime) and dial the backend over an outbound
# WebSocket — see docs/engineering/deployment.md for how to start one.
services:
  backend:
    image: ${REPO2REE_BACKEND_IMAGE:-docker.io/vuducanh1112/repo2ree-backend:edge}
    ports:
      - "8000:8000"
    volumes:
      - repo2ree-demo-data:/app/.repo2ree
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Optional OTLP collector for traces/metrics/logs — pass through from
      # the host so e.g. `OTLP_ENDPOINT=http://host.docker.internal:4318 make
      # e2e-demo-stack` lights up tracing. Unset means no collector.
      # Collectors that authenticate ingest (e.g. ClickStack's ingestion API
      # key) take their headers via the standard OTLP env var, e.g.
      # `OTEL_EXPORTER_OTLP_HEADERS=authorization=<key>`.
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    # No docker.sock here: the backend is pure control plane — every touch of
    # a container runtime goes through a connected agent over its outbound
    # WebSocket.

  gui:
    image: ${REPO2REE_GUI_IMAGE:-docker.io/vuducanh1112/repo2ree-gui:edge}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      BACKEND_UPSTREAM: backend:8000

volumes:
  repo2ree-demo-data:
