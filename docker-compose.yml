# Self-contained local demo: GUI + backend + a Docker provider. The provider
# owns the Docker socket and creates one isolated workbench container per REE;
# the backend remains a pure control plane with no Docker access.
services:
  backend:
    image: ${REPO2REE_BACKEND_IMAGE:-docker.io/vuducanh1112/repo2ree-backend:edge}
    ports:
      - "8000:8000"
    volumes:
      - repo2ree-demo-data:/app/.repo2ree
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Optional OTLP collector for traces/metrics/logs — pass through from
      # the host so e.g. `OTLP_ENDPOINT=http://host.docker.internal:4318 just
      # e2e-demo-stack` lights up tracing. Unset means no collector.
      # Collectors that authenticate ingest (e.g. ClickStack's ingestion API
      # key) take their headers via the standard OTLP env var, e.g.
      # `OTEL_EXPORTER_OTLP_HEADERS=authorization=<key>`.
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    # No docker.sock here: the backend is pure control plane — every touch of
    # a container runtime goes through a connected workbench over its outbound
    # WebSocket.

  gui:
    image: ${REPO2REE_GUI_IMAGE:-docker.io/vuducanh1112/repo2ree-gui:edge}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      BACKEND_UPSTREAM: backend:8000

  provider:
    image: ${REPO2REE_PROVIDER_IMAGE:-docker.io/vuducanh1112/repo2ree-provider-docker:edge}
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - repo2ree-provider-state:/var/lib/repo2ree-provider
    environment:
      PROVIDER_API_WS_URL: ws://backend:8000/provider/connect
      PROVIDER_WORKBENCH_API_WS_URL: ws://backend:8000/workbench/connect
      # Provider-created containers are not Compose services, so explicitly
      # join them to the demo network where the `backend` service name resolves.
      PROVIDER_WORKBENCH_DOCKER_NETWORK: ${REPO2REE_NETWORK:-repo2ree-demo}
      PROVIDER_DOCKER_MODE: ${PROVIDER_DOCKER_MODE:-dind}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PROVIDER_WORKBENCH_TELEMETRY: ${PROVIDER_WORKBENCH_TELEMETRY:-}
      PROVIDER_WORKBENCH_OTLP_ENDPOINT: ${PROVIDER_WORKBENCH_OTLP_ENDPOINT:-}

volumes:
  repo2ree-demo-data:
  repo2ree-provider-state:

networks:
  default:
    # A predictable name is part of the demo contract: child workbenches are
    # launched through the Docker API rather than by Compose and must name it.
    name: ${REPO2REE_NETWORK:-repo2ree-demo}
