
[project]
name = "repo2ree"
version = "0.1.0"
description = "A utility tool to create a reusable execution environment from a repo."
readme = "README.md"
requires-python = "~=3.13"
dependencies = [
    "click",
    "packaging~=25.0",
    "pydantic",
    "requests~=2.32.5",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "pre-commit~=4.3.0", 
    "ruff~=0.12.11",
]

[project.scripts]
repo2ree = "repo2ree.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree"]
