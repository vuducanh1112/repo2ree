name: reproducible_project
channels:
  # 1. Primary Source for Community Packages (Highest Priority)
  - conda-forge
  
  # 2. Specific GPU/ML Channels
  - pytorch
  - nvidia
  
  # 3. Fallback (Lowest Priority - only checked if others fail)
  - defaults

dependencies:
  # --- Core Environment & Python Version ---
  # Pinned to ensure everyone uses a specific Python interpreter
  - python=3.11.8
  
  # --- Standard Packages (Conda Install) ---
  # Conda-forge provides fast, well-optimized packages
  - numpy=1.26
  - pandas=2.2
  - scikit-learn
  - matplotlib

  # --- GPU Dependencies (Requires 'pytorch' and 'nvidia' channels) ---
  # Ensures the CUDA toolkit is installed for GPU libraries
  - cudatoolkit=12.1
  
  # --- Build Strings for Reproducibility (Advanced Pinning) ---
  # Explicitly pinning a specific build ensures high binary reproducibility
  - openjdk=17.0.7=h7c3d9a6_0

  # --- Pip Dependencies (Installed AFTER Conda) ---
  - pip
  - pip:
    # Packages installed via pip from the public PyPI
    - joblib==1.3.2
    
    # ML packages requiring exact versions for reliability
    - transformers==4.39.1
    - accelerate==0.27.2
    
    # A package that is only available on PyPI
    - requests-html