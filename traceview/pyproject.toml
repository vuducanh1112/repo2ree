[project]
name = "repo2ree-traceview"
version = "0.1.0"
description = "Operation-level views of recorded repo2ree behaviour: checked evidence with spans as context."
requires-python = "~=3.13.0"
dependencies = ["pydantic~=2.11.7", "repo2ree-conformance"]

[tool.uv.sources]
repo2ree-conformance = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_traceview"]


[tool.importlinter]
include_external_packages = true
root_packages = [
    "repo2ree_traceview", "repo2ree_conformance", "repo2ree_api", "repo2ree_core", "repo2ree_docker",
    "repo2ree_executor", "repo2ree_provider_docker", "repo2ree_protocol", "repo2ree_supervisor",
    "repo2ree_workbench",
]

# Views read what the runtime recorded, never the code that recorded it.
[[tool.importlinter.contracts]]
name = "Traceview stays independent of runtime packages"
type = "forbidden"
source_modules = ["repo2ree_traceview"]
forbidden_modules = [
    "repo2ree_api", "repo2ree_core", "repo2ree_docker", "repo2ree_executor",
    "repo2ree_provider_docker", "repo2ree_protocol", "repo2ree_supervisor", "repo2ree_workbench",
]

# The checker's model is the only model of what happened. Views take its public
# surface; reading journals or REE histories themselves would grow a second one
# (the retired history package).
[[tool.importlinter.contracts]]
name = "Traceview uses only the checker's public surface"
type = "forbidden"
source_modules = ["repo2ree_traceview"]
forbidden_modules = [
    "repo2ree_conformance.sources",
    "repo2ree_conformance.files",
    "repo2ree_conformance.cli",
    "repo2ree_conformance.codegen",
    "repo2ree_conformance.html",
    "repo2ree_conformance.report",
    "repo2ree_conformance.views",
]
# The package root re-exports load_evidence from sources; only direct reaches count.
allow_indirect_imports = true

# And the checker never depends on its views.
[[tool.importlinter.contracts]]
name = "Conformance does not depend on its views"
type = "forbidden"
source_modules = ["repo2ree_conformance"]
forbidden_modules = ["repo2ree_traceview"]

# Building a view is pure: the same evidence and spans always draw the same page.
[[tool.importlinter.contracts]]
name = "Traceview builders have no I/O dependencies"
type = "forbidden"
source_modules = [
    "repo2ree_traceview.spans",
    "repo2ree_traceview.model",
    "repo2ree_traceview.operations",
    "repo2ree_traceview.sequence",
    "repo2ree_traceview.provenance",
    "repo2ree_traceview.render",
]
forbidden_modules = ["os", "sys", "subprocess", "socket", "http", "urllib", "tempfile", "shutil", "random", "uuid", "time"]
allow_indirect_imports = true
