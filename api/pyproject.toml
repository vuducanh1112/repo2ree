[project]
name = "repo2ree-api"
version = "0.1.0"
dependencies = [
    "repo2ree-authoring",
    "repo2ree-protocol",
    "repo2ree-ree",
    "repo2ree-supervisor",
    "fastapi~=0.160.0",
    "pydantic-settings~=2.16",
    "uvicorn~=0.40.0",
    # uvicorn serves /workbench/connect; without a WebSocket implementation it
    # 404s the upgrade. The backend image installs only the API package, so it
    # must declare the transport dependency directly.
    "websockets~=15.0",
    "python-multipart~=0.0.32",
    "requests~=2.34",
    "opentelemetry-exporter-otlp-proto-http~=1.45",
    "opentelemetry-instrumentation-fastapi~=0.66b1",
]

[dependency-groups]
dev = [
    "repo2ree-core",
]

[tool.uv.sources]
repo2ree-authoring = { workspace = true }
repo2ree-core = { workspace = true }
repo2ree-protocol = { workspace = true }
repo2ree-ree = { workspace = true }
repo2ree-supervisor = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_api"]
