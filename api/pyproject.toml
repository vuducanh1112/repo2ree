[project]
name = "repo2ree-api"
version = "0.1.0"
dependencies = [
    "repo2ree-protocol",
    "repo2ree-supervisor",
    "repo2ree-core",
    "fastapi~=0.128.0",
    "pydantic-settings~=2.12.0",
    "uvicorn~=0.40.0",
    # uvicorn serves /agent/connect; without a WebSocket implementation it
    # 404s the upgrade. The dev workspace gets this via the agent package —
    # the backend image (uv sync --package repo2ree-api) does not.
    "websockets~=15.0",
    "python-multipart~=0.0.21",
    "requests~=2.32.5",
    "opentelemetry-exporter-otlp~=1.42.1",
    "opentelemetry-instrumentation-fastapi~=0.63b1",
]

[tool.uv.sources]
repo2ree-protocol = { workspace = true }
repo2ree-supervisor = { workspace = true }
repo2ree-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_api"]
