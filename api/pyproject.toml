[project]
name = "repo2ree-api"
version = "0.1.0"
dependencies = [
    "repo2ree-protocol",
    "repo2ree-core",
    "fastapi~=0.128.0",
    "uvicorn~=0.40.0",
    "python-multipart~=0.0.21",
    "requests~=2.32.5",
]

[tool.uv.sources]
repo2ree-protocol = { workspace = true }
repo2ree-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_api"]
