
[project]
name = "repo2ree"
version = "0.1.0"
description = "A utility tool to create a reusable execution environment from a repo."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "click~=8.2.1",
    "docker~=7.1.0",
    "dockerfile-parse~=2.0.1",
    "fastapi~=0.128.0",
    "GitPython~=3.1.45",
    "kubernetes~=35.0.0",
    "packaging~=25.0",
    "pydantic~=2.11.7",
    "pydantic-settings~=2.12.0",
    "python-debian~=1.0.1",
    "python-multipart~=0.0.21",
    "PyYaml~=6.0.3",
    "requests~=2.32.5",
    "sqlmodel~=0.0.31",
    "swh.model~=8.4.1",
    "tomli~=2.2.1",
    "tomli-w~=1.2.0",
    "uvicorn~=0.40.0",
]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "mypy~=1.20.1",
    "pytest~=8.4.1",
    "pre-commit~=4.3.0", 
    "ruff~=0.12.11",
    "syrupy~=5.0.0",
]
notebooks = [
    "ipykernel~=7.2.0",
    "notebook~=7.5.4",
    "matplotlib~=3.10.7",
]

[project.scripts]
repo2ree = "repo2ree.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree"]
