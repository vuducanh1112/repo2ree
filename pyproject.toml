
[project]
name = "repo2ree"
version = "0.1.0"
description = "A utility tool to create a reusable execution environment from a repo."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = []

[tool.uv.workspace]
members = ["protocol", "core", "supervisor", "api", "executor"]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "mypy~=1.20.1",
    "pytest~=8.4.1",
    "pre-commit~=4.3.0", 
    "ruff~=0.12.11",
    "syrupy~=5.0.0",
]
notebooks = [
    "ipykernel~=7.2.0",
    "notebook~=7.5.4",
    "matplotlib~=3.10.7",
]

[tool.ruff]
src = ["protocol/src", "core/src", "supervisor/src", "api/src", "executor/src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
extend-ignore = [
    # subprocess calls with a list arg (not shell=True) are the safe pattern;
    # S603/S607 fire on every docker/git invocation and add no signal here.
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"core/src/repo2ree_core/debian_packages_util/pin_package.py" = [
    "E501",  # snapshot URL f-strings exceed 120 chars; non-wrappable archive URL format
]
"*/tests/*" = [
    "S101",  # assert is the standard pytest assertion pattern
]

[tool.mypy]
mypy_path = ["protocol/src", "core/src", "supervisor/src", "api/src", "executor/src"]

# docker (docker-py) ships no py.typed and has no maintained stub package, so
# treat the whole namespace as untyped (Any) rather than analyzing its sources.
[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
follow_imports = "skip"
