
[project]
name = "repo2ree"
version = "0.1.0"
description = "A utility tool to create a reusable execution environment from a repo."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = []

[tool.uv.workspace]
members = ["ree", "protocol", "telemetry", "authoring", "core", "supervisor", "api", "executor", "docker-support", "provider", "workbench", "assurance/checker", "assurance/dossier", "assurance/collector", "assurance/traceview", "testbed", "repoview"]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    # Architecture contracts (`just check-architecture`): the backend counterpart of the
    # GUI's dependency-cruiser rules. Neither ruff nor mypy sees the import
    # graph, so layering is only enforced here.
    "import-linter~=2.15",
    # Validates sample journal records against the generated behaviour event schema
    # (contracts/behaviour), so the schema and the checker agree on what a record is.
    "jsonschema~=4.26",
    "types-jsonschema~=4.26",
    # Property-based testing (the `property`-marked tests). Resolves transitively
    # today via core's test-only `swh.model` oracle, but declared directly so the
    # property tests don't hinge on that pin.
    "hypothesis~=6.170",
    "mypy~=2.4",
    "packaging~=25.0",
    "pytest~=9.1",
    "pytest-cov~=7.1",
    # The single ruff version for this tree: the gate and a local `ruff`
    # invocation both resolve to this one. It replaced a pinned
    # ruff-pre-commit hook that drifted to a newer ruff than this pin, which is
    # how an RUF043 finding reached a commit `just check-backend` had just passed.
    "ruff~=0.17.1",
    "schemathesis~=4.32",
]

[tool.pytest.ini_options]
# Show skip reasons in the summary: the docker-gated integration tiers skip
# (never fake) when docker or the workbench image is absent, and a silent
# skip is indistinguishable from a pass without this. --strict-markers turns a
# typo'd or unregistered marker into a collection error rather than a silent
# no-op, so the vocabulary below stays the single source of truth.
addopts = "-ra --strict-markers"

# Test-selection markers, orthogonal to the unit/integration directory split
# (which is about *where* a test can run — no infra vs docker-gated). These tag
# *what kind* of test it is, so CI can carve profiles: the fast gate runs the
# default set, heavier profiles select the generative/property tier. Apply at
# module level (`pytestmark = pytest.mark.property`) when a whole file is one
# kind. See the accompanying `*_properties.py` files for the pattern.
markers = [
    "property: generative/invariant test (hypothesis); slower, randomized inputs",
]

# Coverage measures backend workspace src trees. History has its own coverage config. Listing them here lets the
# Just recipes pass a bare `--cov` (no per-package paths) and keep the same
# config for a direct `pytest --cov` run. Branch coverage is on because a lot
# of the value is in the error/cancel branches the container-free tier added.
[tool.coverage.run]
branch = true
# Fallback data file for an ad-hoc `pytest --cov` with no tier chosen. The
# Measured tiers (unit, integration, e2e, demo) override this via COVERAGE_FILE.
# Unit and integration suites first write isolated parts below
# data/<tier>-parts/<package>/ and combine them into data/<tier>/.coverage; the
# stack tiers write directly below data/<tier>/. Separate directories, rather
# than suffixed sibling files, keep `coverage combine` from consuming another
# tier's parallel-mode output and let each combine name its inputs explicitly.
# See just/backend-tests.just.
#
# The `python/` level is the runtime, above the tier: coverage.py's reports are
# one measuring tool's subtree, sibling to the browser V8 reports, because
# unioning tiers is a coverage.py operation with no cross-runtime form.
data_file = "${REPO2REE_TEST_RUN_DIR-test-artifacts}/python/coverage/data/adhoc/.coverage"
# The e2e/demo tiers run the API server and workbench services under coverage and stop them
# with SIGTERM; without this, coverage's atexit save never fires and the run
# records nothing. Inert for the pytest targets, which exit normally.
sigterm = true
source = [
    "docker-support/src/repo2ree_docker",
    "ree/src/repo2ree_ree",
    "protocol/src/repo2ree_protocol",
    "telemetry/src/repo2ree_telemetry",
    "authoring/src/repo2ree_authoring",
    "core/src/repo2ree_core",
    "supervisor/src/repo2ree_supervisor",
    "api/src/repo2ree_api",
    "executor/src/repo2ree_executor",
    "provider/src/repo2ree_provider_docker",
    "workbench/src/repo2ree_workbench",
]
omit = [
    "*/__main__.py",  # trivial `python -m` entrypoints
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
src = [
    "ree/src",
    "protocol/src",
    "telemetry/src",
    "authoring/src",
    "core/src",
    "supervisor/src",
    "api/src",
    "executor/src",
    "docker-support/src",
    "provider/src",
    "workbench/src",
    "assurance/checker/src",
    "assurance/traceview/src",
    "assurance/collector/src",
    "assurance/dossier/src",
    "testbed/src",
    "repoview/src",
]
line-length = 120

[tool.ruff.lint]
# Grouped by what each family buys us rather than alphabetically, because the
# question worth answering at review time is "why is this on" and not "is this
# sorted". Families deliberately left off: D (docstring formatting — the tree
# documents *why*, and a linter can only check that a docstring exists), TC
# (moving annotations into TYPE_CHECKING blocks breaks pydantic/FastAPI, which
# resolve them at runtime), COM (conflicts with ruff format), EM/TRY/ANN/ARG
# (style churn with no defect signal here), and ERA (it reads the `# ---- Section
# ---- ` banner idiom this tree uses in five modules as commented-out code).
select = [
    # The original set: pycodestyle, pyflakes, import order, pyupgrade, bugbear,
    # bandit, naming.
    "E", "F", "W", "I", "UP", "B", "S", "N",

    # Rules the tree already assumes are on. Both BLE001 and SLF001 carry
    # written `# noqa` justifications in the source, which were dead comments
    # while the rules were unselected. RUF100 is what keeps that from recurring:
    # it fails on a suppression that no longer suppresses anything.
    "BLE",   # blind `except Exception`
    "SLF",   # private-member access across objects
    "RUF",

    # INP001 is why `repo2ree_api.storage` went missing from the import graph:
    # a package without `__init__.py` is invisible to grimp, so every
    # architecture contract silently skipped it. This rule is the guard that
    # keeps the import-linter contracts honest about what they actually cover.
    "INP",

    # Correctness families this codebase is specifically exposed to: async
    # routes that must not block the event loop, and timestamps that must stay
    # timezone-aware (the whole point of `core.time_utils`).
    "ASYNC",
    "DTZ",
    "LOG", "G",  # logging call and format-string misuse

    # General defect-adjacent cleanliness. All were at or near zero already.
    "A",      # shadowing builtins
    "C4",     # comprehension misuse
    "FLY",    # static str.join
    "FURB",
    "ISC",    # implicit string concatenation
    "PERF",
    "PIE",
    "PT",     # pytest style
    "PTH",    # os.path calls that should be pathlib
    "PYI",
    "RET",
    "SIM",
    "T20",    # stray print()
    "TID",    # banned/relative imports
    "YTT",    # sys.version misuse

    # Two pylint rules worth the noise budget on their own:
    "PLW1510",  # subprocess.run without an explicit `check=`
    "PLC0415",  # function-local import — the shape of the cycle core's layering
                # comment describes as the original sin
]
extend-ignore = [
    # subprocess calls with a list arg (not shell=True) are the safe pattern;
    # S603/S607 fire on every docker/git invocation and add no signal here.
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
# Test code is shaped by pytest, not by the rules that govern the packages it
# exercises. Each entry below is a property of how pytest works rather than a
# concession: silencing it in `src` too would lose real signal.
"*/tests/*" = [
    "S101",    # assert is the standard pytest assertion pattern
    # Test dirs deliberately ship no __init__.py so module names come from file
    # paths — the same arrangement `explicit_package_bases` exists for above.
    # Adding the __init__.py this rule asks for would collide the per-tier
    # conftest modules, which is the opposite of what INP001 is protecting.
    "INP001",
    # Tests import inside a function to keep an import behind a skip guard, or
    # to observe import side effects. In `src` a function-local import is a
    # cycle smell; here it is the point.
    "PLC0415",
    # A test may assert on the private state it is testing; the module under
    # test is not a black box to its own unit tests.
    "SLF001",
    # Fixtures and e2e walkthroughs shell out and assert on the result object
    # themselves, so an explicit `check=` would just raise before the assert.
    "PLW1510",
    # The e2e walkthrough scripts narrate their progress on stdout by design.
    "T201",
    # PT011 wants a `match=` on every broad `pytest.raises`. The nine sites are
    # path-safety rejection tests, and the parametrized ones raise a *different*
    # message per input, so no single pattern fits — tightening them means
    # deciding which message text is contract and which is incidental. Worth
    # doing deliberately; not worth inventing to satisfy a linter.
    "PT011",
]
# Every handler is a boundary that turns any failure into a failed ActionResult
# — the run must record what went wrong, never propagate it into the step
# runner. That is one uniform, deliberate pattern across the whole directory, so
# it is stated once here rather than as a `noqa` on each of sixteen handlers.
# Blind catches *outside* this directory still have to justify themselves.
"*/operations/handlers/*" = ["BLE001"]
# The OTLP exporters and `requests` are imported only where a host exports, so
# the executor's closure can leave them out.
"*/repo2ree_telemetry/bootstrap.py" = ["PLC0415"]
"*/repo2ree_telemetry/relay.py" = ["PLC0415"]
"*/repo2ree_telemetry/relayed_json.py" = ["PLC0415"]
# `scripts/` holds developer tools invoked as `python scripts/x.py`, not an
# importable package (`just check-scripts` lints it separately from the six
# workspace packages). A command-line tool with no stdout is useless, and the
# directory has no `__init__.py` for the same reason the test dirs do not.
"scripts/*" = ["T201", "INP001"]
# The testbed's modules are the commands the test recipes run, and report on stdout the same way.
"testbed/src/*" = ["T201"]
# So are the repository views': each writes its report and says where.
"repoview/src/*" = ["T201"]

# ================================================
# Architecture contracts (`just check-architecture`)
# ================================================
#
# The backend counterpart of the GUI's dependency-cruiser rules
# (gui/.dependency-cruiser.js, run by check-gui). Ruff and mypy never look
# at the import graph, so nothing else in the backend gate can see a layering
# violation or an import cycle — every contract below was a real defect at some
# point rather than a hypothetical.
#
[tool.importlinter]
root_packages = [
    "repo2ree_api",
    "repo2ree_authoring",
    "repo2ree_core",
    "repo2ree_docker",
    "repo2ree_executor",
    "repo2ree_provider_docker",
    "repo2ree_protocol",
    "repo2ree_ree",
    "repo2ree_supervisor",
    "repo2ree_telemetry",
    "repo2ree_workbench",
]
include_external_packages = true

# ---- The workspace itself -----------------------------------------------
#
# High to low; siblings on one row may not import each other. This alone keeps
# the REE format, the protocol, the authoring rules, and telemetry below every
# plane, and core out of the processes that drive it.
[[tool.importlinter.contracts]]
name = "Workspace layers"
type = "layers"
layers = [
    "repo2ree_api",
    "repo2ree_supervisor",
    "repo2ree_provider_docker : repo2ree_workbench : repo2ree_executor",
    "repo2ree_docker : repo2ree_core",
    "repo2ree_authoring : repo2ree_telemetry",
    "repo2ree_protocol",
    "repo2ree_ree",
]

# The REE format and the protocol are data a second implementation generates
# from their schemas: no transport, no telemetry, no process concerns.
[[tool.importlinter.contracts]]
name = "The format and the protocol are data"
type = "forbidden"
source_modules = ["repo2ree_ree", "repo2ree_protocol"]
forbidden_modules = [
    "anyio",
    "click",
    "fastapi",
    "httpx",
    "opentelemetry",
    "requests",
    "websockets",
    "yaml",
]

[[tool.importlinter.contracts]]
name = "API speaks only protocol"
type = "forbidden"
source_modules = ["repo2ree_api"]
forbidden_modules = [
    "repo2ree_core",
    "repo2ree_docker",
    "repo2ree_executor",
    "repo2ree_provider_docker",
    "repo2ree_workbench",
]

# Capacity and execution are separate authorities: a process holding one
# vocabulary cannot form a request of the other. Both share `frames`.
[[tool.importlinter.contracts]]
name = "Capacity and execution vocabularies are independent"
type = "independence"
modules = [
    "repo2ree_protocol.provider",
    "repo2ree_protocol.workbench",
]

# The workbench runs inside whatever environment its provider chose, so it
# carries no operation, no substrate, and no capacity vocabulary.
[[tool.importlinter.contracts]]
name = "Workbench speaks only protocol"
type = "forbidden"
source_modules = ["repo2ree_workbench"]
forbidden_modules = [
    "repo2ree_core",
    "repo2ree_docker",
    "repo2ree_protocol.provider",
]

[[tool.importlinter.contracts]]
name = "Supervisor speaks only protocol"
type = "forbidden"
source_modules = ["repo2ree_supervisor"]
forbidden_modules = [
    "repo2ree_core",
    "repo2ree_docker",
    "repo2ree_executor",
    "repo2ree_provider_docker",
    "repo2ree_workbench",
]

[[tool.importlinter.contracts]]
name = "Provider never executes"
type = "forbidden"
source_modules = ["repo2ree_provider_docker"]
forbidden_modules = [
    "repo2ree_core",
    "repo2ree_protocol.workbench",
]

# ---- Inside the API ------------------------------------------------------
#
# The API's tiers, high to low. Each layer may import everything below it and
# nothing above. `main` is assembly only; the two step graphs sit on the control
# plane; the control plane sits on the workbench transport; everything rests on
# the wire contract and the composition root.
#
# `exhaustive` is what makes this contract mean what it appears to mean: without
# it, a top-level module missing from the list below is not "unconstrained by
# accident", it is simply unconstrained, and nothing reports that. `storage` was
# in that position — and worse, being a namespace package it was missing from
# the graph entirely — while three separate tiers imported it.
[[tool.importlinter.contracts]]
name = "API layers"
type = "layers"
exhaustive = true
# The `python -m repo2ree_api.export_openapi` entrypoint, which imports `main`
# to serialize its OpenAPI document. It is a build script that happens to live
# in the package, not a tier of it.
exhaustive_ignores = ["export_openapi"]
containers = ["repo2ree_api"]
layers = [
    "main",
    # `ree_index_routes` is a route tier like the two beside it, and
    # independent of them: it reads what sealing left behind rather than
    # driving a step.
    "authoring : review : ree_index_routes",
    "control",
    "workbench",
    "storage",
    "contracts",
    "paths : pagination",
    "deps",
    # Below `deps` so the composition root can build the index singleton, and
    # below `contracts` so neither knows the wire shape: the durable record is
    # projected from the sealed manifest, not from a response model, which is
    # what lets a peer rebuild an identical entry from a bundle alone.
    #
    # `ree_index` sits above `deposit` because an entry carries the
    # archive-binding attestations deposit defines. That direction is load
    # bearing: recording a published deposit into the index must be driven from
    # a route above both, never by an adapter reaching back up — which would
    # close a cycle between the two.
    "ree_index",
    "deposit",
    "settings",
    "clock",
]

# The author's step graph and the reviewer's mirror it. They deliberately look
# alike, which is exactly what makes a shortcut between them tempting and wrong:
# a reviewer route reaching into an authoring route would let review evidence be
# produced by the code under review. Both compose the shared lower layers
# instead.
[[tool.importlinter.contracts]]
name = "Authoring and review never reach into each other"
type = "independence"
modules = [
    "repo2ree_api.authoring",
    "repo2ree_api.review",
]

# The published wire vocabulary is a leaf: it describes the contract, so it can
# never depend on the code that serves it. A response model that imported a
# route would make the OpenAPI document a function of the implementation.
[[tool.importlinter.contracts]]
name = "The wire contract imports no implementation"
type = "forbidden"
source_modules = ["repo2ree_api.contracts"]
forbidden_modules = [
    "repo2ree_api.authoring",
    "repo2ree_api.review",
    "repo2ree_api.control",
    "repo2ree_api.workbench",
    "repo2ree_api.storage",
    "repo2ree_api.deps",
]

# Core's spine, high to low. Each tier is defined by what it is allowed to
# know: `operations` composes commands out of everything below it; `bundle`
# packages an REE together with the evidence produced about it; `evidence` is
# stored *inside* an REE, so it knows the aggregate but the aggregate must not
# know it; the capability packages implement source/build concerns; `workspace`
# owns the materialized mutable execution tree; `persistence` owns the durable
# REE tree and record; `domain` is the vocabulary all of them are written in.
#
# Exhaustive: a new top-level package in core has to declare its row.
[[tool.importlinter.contracts]]
name = "Core layers"
type = "layers"
exhaustive = true
containers = ["repo2ree_core"]
layers = [
    "operations",
    "bundle",
    "evidence",
    "analysis : doctor : execution : reproduction : source_repo",
    "workspace",
    "persistence",
    "author_recipes",
    "domain",
    "digests : failures : time_utils",
]

# The core counterpart of the API's authoring/review independence rule, and the
# layer where it actually bites: this is where review evidence is produced. A
# reviewer handler importing an authoring one would mean the code under review
# also certifies itself, and the two families mirror each other closely enough
# that such an import would read as reuse. What they legitimately share is
# `operations.steps`, which is why that sits beside both rather than inside
# either.
[[tool.importlinter.contracts]]
name = "Author and review handlers never reach into each other"
type = "independence"
modules = [
    "repo2ree_core.operations.handlers.author",
    "repo2ree_core.operations.handlers.review",
]

# Within `operations`, the shared step machinery is below the handlers that fill
# it in — it exists to be composed, never to compose. A step runner that reached
# back into a handler would be recognising its callers, which is the coupling
# the runner's own descriptor (`RunnableStep`) exists to avoid.
[[tool.importlinter.contracts]]
name = "Step machinery never imports a handler"
type = "forbidden"
source_modules = ["repo2ree_core.operations.steps"]
forbidden_modules = [
    "repo2ree_core.operations.handlers",
    "repo2ree_core.operations.dispatch",
]

# The verbs the executor CLI and the generated run.sh both spell; it sits in
# `reproduction` but imports nothing of core.
[[tool.importlinter.contracts]]
name = "The reproduction verbs depend on no package"
type = "forbidden"
source_modules = ["repo2ree_core.reproduction.commands"]
forbidden_modules = [
    "repo2ree_core.analysis",
    "repo2ree_core.author_recipes",
    "repo2ree_core.bundle",
    "repo2ree_core.domain",
    "repo2ree_core.evidence",
    "repo2ree_core.execution",
    "repo2ree_core.operations",
    "repo2ree_core.persistence",
    "repo2ree_core.source_repo",
    "repo2ree_core.workspace",
]

[tool.mypy]
mypy_path = [
    "ree/src",
    "protocol/src",
    "telemetry/src",
    "authoring/src",
    "core/src",
    "supervisor/src",
    "api/src",
    "executor/src",
    "docker-support/src",
    "provider/src",
    "workbench/src",
    "assurance/checker/src",
    "assurance/traceview/src",
    "assurance/collector/src",
    "assurance/dossier/src",
    "testbed/src",
    "repoview/src",
]
# Test dirs ship no __init__.py, so module names must come from file paths —
# otherwise the per-tier conftest.py files (unit/ and integration/) collide.
explicit_package_bases = true
# The evidence this codebase produces is only as trustworthy as the code that
# derives it, and most of that derivation is already annotated — turning strict
# on asserts what the source already does rather than demanding new work of it.
strict = true

# Tests import shared constants from their tier's conftest as a top-level
# module (`from conftest import …`) — resolvable under pytest, which puts the
# test dir on sys.path, but not under mypy's file-path-based module naming.
#
# follow_imports alongside ignore_missing_imports because the repo root now has
# a conftest.py of its own (it pins Hypothesis's storage directory). mypy runs
# from the root, so bare `conftest` became *resolvable* — to that file, which is
# never the one a tier meant. Skipping the follow restores the intended `Any`
# instead of type-checking every tier's import against the wrong module.
[[tool.mypy.overrides]]
module = "conftest"
ignore_missing_imports = true
follow_imports = "skip"

# Shared test-helper modules imported as top-level modules the same way (put on
# sys.path by pytest, but invisible to mypy's file-path-based module naming).
# A tier reaches for one of these whenever its shared names must survive being
# imported beside another tier: two suites' conftest.py files share the module
# name `conftest`, so whichever pytest loads last is the one a bare import
# finds — see api/tests/integration/api_integration_bench.py.
[[tool.mypy.overrides]]
module = ["scriptinfer_helpers", "api_integration_bench", "system_client", "test_spec", "test_check", "traceview_scenario"]
ignore_missing_imports = true

# Tests keep the half of strict that finds defects — wrong argument types,
# unnarrowed Optionals, annotations that disagree with what a fixture actually
# holds — and drop the half that only asks for ceremony. A pytest function's
# return type is always None and its helpers are composed by nothing, so
# spelling those out states what the signature already says; re-exports are the
# same, since a test importing a symbol through the module under test is reading
# that module's surface rather than building on it.
[[tool.mypy.overrides]]
module = ["*.tests.*", "conftest", "scriptinfer_helpers", "api_integration_bench", "system_client", "test_spec", "test_check", "traceview_scenario"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
no_implicit_reexport = false


[tool.repo2ree.workspace]
backend = ["ree", "protocol", "telemetry", "authoring", "core", "supervisor", "api", "executor", "docker-support", "provider", "workbench"]
assurance = ["assurance/checker", "assurance/dossier", "assurance/collector", "assurance/traceview"]
tooling = ["testbed", "repoview"]

[tool.repo2ree.closures]
api = "repo2ree-api"
provider = "repo2ree-provider-docker"
