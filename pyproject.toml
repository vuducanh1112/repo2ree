
[project]
name = "repo2ree"
version = "0.1.0"
description = "A utility tool to create a reusable execution environment from a repo."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = []

[tool.uv.workspace]
members = ["core", "api", "cli"]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "mypy~=1.20.1",
    "pytest~=8.4.1",
    "pre-commit~=4.3.0", 
    "ruff~=0.12.11",
    "syrupy~=5.0.0",
]
notebooks = [
    "ipykernel~=7.2.0",
    "notebook~=7.5.4",
    "matplotlib~=3.10.7",
]

[tool.mypy]
mypy_path = ["core/src", "api/src", "cli/src"]

# docker (docker-py) ships no py.typed and has no maintained stub package, so
# treat the whole namespace as untyped (Any) rather than analyzing its sources.
[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
follow_imports = "skip"
