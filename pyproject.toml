
[project]
name = "repo2ree"
version = "0.1.0"
description = "A utility tool to create a reusable execution environment from a repo."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = []

[tool.uv.workspace]
members = ["protocol", "core", "supervisor", "api", "executor", "agent"]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    # Architecture contracts (`make arch-checks`): the backend counterpart of the
    # frontend's dependency-cruiser rules. Neither ruff nor mypy sees the import
    # graph, so layering is only enforced here.
    "import-linter~=2.13.0",
    # Property-based testing (the `property`-marked tests). Resolves transitively
    # today via core's test-only `swh.model` oracle, but declared directly so the
    # property tests don't hinge on that pin.
    "hypothesis~=6.155.7",
    "mypy~=1.20.1",
    "pytest~=8.4.1",
    "pytest-cov~=7.1.0",
    "pre-commit~=4.3.0",
    "ruff~=0.12.11",
    "syrupy~=5.0.0",
]
notebooks = [
    "ipykernel~=7.2.0",
    "notebook~=7.5.4",
    "matplotlib~=3.10.7",
]

[tool.pytest.ini_options]
# Show skip reasons in the summary: the docker-gated integration tiers skip
# (never fake) when docker or the workbench image is absent, and a silent
# skip is indistinguishable from a pass without this. --strict-markers turns a
# typo'd or unregistered marker into a collection error rather than a silent
# no-op, so the vocabulary below stays the single source of truth.
addopts = "-ra --strict-markers"

# Test-selection markers, orthogonal to the unit/integration directory split
# (which is about *where* a test can run — no infra vs docker-gated). These tag
# *what kind* of test it is, so CI can carve profiles: the fast gate runs the
# default set, heavier profiles select the generative/property tier. Apply at
# module level (`pytestmark = pytest.mark.property`) when a whole file is one
# kind. See the accompanying `*_properties.py` files for the pattern.
markers = [
    "property: generative/invariant test (hypothesis); slower, randomized inputs",
]

# Coverage measures the five workspace src trees. Listing them here lets the
# Makefile pass a bare `--cov` (no per-package paths) and keeps the same
# config for a direct `pytest --cov` run. Branch coverage is on because a lot
# of the value is in the error/cancel branches the container-free tier added.
[tool.coverage.run]
branch = true
# All test artifacts live under test-artifacts/ (one gitignored root). Coverage
# data — the .coverage db plus parallel .coverage.* files — goes here; coverage
# creates the directory. The e2e target overrides this via COVERAGE_FILE to keep
# its own data file alongside, in the same dir.
data_file = "test-artifacts/coverage/data/.coverage"
# e2e-coverage runs the API server under coverage and stops it with SIGTERM;
# without this, coverage's atexit save never fires and the run records nothing.
# Inert for the pytest targets, which exit normally.
sigterm = true
source = [
    "protocol/src/repo2ree_protocol",
    "core/src/repo2ree_core",
    "supervisor/src/repo2ree_supervisor",
    "api/src/repo2ree_api",
    "executor/src/repo2ree_executor",
    "agent/src/repo2ree_agent",
]
omit = [
    "*/__main__.py",  # trivial `python -m` entrypoints
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
src = ["protocol/src", "core/src", "supervisor/src", "api/src", "executor/src", "agent/src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "N"]
extend-ignore = [
    # subprocess calls with a list arg (not shell=True) are the safe pattern;
    # S603/S607 fire on every docker/git invocation and add no signal here.
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = [
    "S101",  # assert is the standard pytest assertion pattern
]

# ================================================
# Architecture contracts (`make arch-checks`)
# ================================================
#
# The backend counterpart of the frontend's dependency-cruiser rules
# (frontend/.dependency-cruiser.js, run by fe-checks). Ruff and mypy never look
# at the import graph, so nothing else in the backend gate can see a layering
# violation or an import cycle — every contract below was a real defect at some
# point rather than a hypothetical.
#
# Only repo2ree_api is under contract today. The other packages are declared as
# root packages so cross-package imports resolve; core's own layering is the
# next tranche and needs its cycles broken first.
[tool.importlinter]
root_packages = [
    "repo2ree_api",
    "repo2ree_core",
    "repo2ree_protocol",
    "repo2ree_supervisor",
]

# The API's tiers, high to low. Each layer may import everything below it and
# nothing above. `main` is assembly only; the two step graphs sit on the control
# plane; the control plane sits on the workbench transport; everything rests on
# the wire contract and the composition root.
[[tool.importlinter.contracts]]
name = "API layers"
type = "layers"
layers = [
    "repo2ree_api.main",
    "repo2ree_api.authoring : repo2ree_api.review",
    "repo2ree_api.control",
    "repo2ree_api.workbench",
    "repo2ree_api.contracts",
    "repo2ree_api.deps",
    "repo2ree_api.settings",
]

# The author's step graph and the reviewer's mirror it. They deliberately look
# alike, which is exactly what makes a shortcut between them tempting and wrong:
# a reviewer route reaching into an authoring route would let review evidence be
# produced by the code under review. Both compose the shared lower layers
# instead.
[[tool.importlinter.contracts]]
name = "Authoring and review never reach into each other"
type = "independence"
modules = [
    "repo2ree_api.authoring",
    "repo2ree_api.review",
]

# The published wire vocabulary is a leaf: it describes the contract, so it can
# never depend on the code that serves it. A response model that imported a
# route would make the OpenAPI document a function of the implementation.
[[tool.importlinter.contracts]]
name = "The wire contract imports no implementation"
type = "forbidden"
source_modules = ["repo2ree_api.contracts"]
forbidden_modules = [
    "repo2ree_api.authoring",
    "repo2ree_api.review",
    "repo2ree_api.control",
    "repo2ree_api.workbench",
    "repo2ree_api.deps",
]

[tool.mypy]
mypy_path = ["protocol/src", "core/src", "supervisor/src", "api/src", "executor/src", "agent/src"]
# Test dirs ship no __init__.py, so module names must come from file paths —
# otherwise the per-tier conftest.py files (unit/ and integration/) collide.
explicit_package_bases = true
# The evidence this codebase produces is only as trustworthy as the code that
# derives it, and most of that derivation is already annotated — turning strict
# on asserts what the source already does rather than demanding new work of it.
strict = true

# Tests import shared constants from their tier's conftest as a top-level
# module (`from conftest import …`) — resolvable under pytest, which puts the
# test dir on sys.path, but not under mypy's file-path-based module naming.
[[tool.mypy.overrides]]
module = "conftest"
ignore_missing_imports = true

# Shared test-helper modules imported as top-level modules the same way (put on
# sys.path by pytest, but invisible to mypy's file-path-based module naming).
[[tool.mypy.overrides]]
module = "scriptinfer_helpers"
ignore_missing_imports = true

# Tests keep the half of strict that finds defects — wrong argument types,
# unnarrowed Optionals, annotations that disagree with what a fixture actually
# holds — and drop the half that only asks for ceremony. A pytest function's
# return type is always None and its helpers are composed by nothing, so
# spelling those out states what the signature already says; re-exports are the
# same, since a test importing a symbol through the module under test is reading
# that module's surface rather than building on it.
[[tool.mypy.overrides]]
module = ["*.tests.*", "conftest", "scriptinfer_helpers"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
no_implicit_reexport = false
