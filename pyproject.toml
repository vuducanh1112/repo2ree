
[project]
name = "repo2ree"
version = "0.1.0"
description = "A utility tool to create a reusable execution environment from a repo."
readme = "README.md"
requires-python = "~=3.13"
dependencies = [
    "click~=8.2.1",
    "docker~=7.1.0",
    "dockerfile-parse~=2.0.1",
    "GitPython~=3.1.45",
    "packaging~=25.0",
    "pydantic~=2.11.7",
    "python-debian~=1.0.1",
    "PyYaml~=6.0.3",
    "requests~=2.32.5",
    "tomli~=2.2.1",
    "tomli-w~=1.2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest~=8.4.1",
    "pre-commit~=4.3.0", 
    "ruff~=0.12.11",
    "syrupy~=5.0.0",
]

[project.scripts]
repo2ree = "repo2ree.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree"]
