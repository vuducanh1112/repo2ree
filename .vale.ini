# Vale configuration — prose linting for repo2ree docs.
# `just docs-style-sync` downloads the styles below; documentation checks use
# the already-pinned local copies and never access the network.
StylesPath = .vale/styles
# The required docs gate fails on errors. Passive-voice and weasel-word rules
# remain available for an advisory pass with
# `vale --no-exit --minAlertLevel=warning docs README.md`.
MinAlertLevel = suggestion

# Project terms that Vale.Spelling should accept (see styles/config/vocabularies).
Vocab = repo2ree

# Community style packages (downloaded by `vale sync`).
Packages = write-good, proselint

[*.md]
BasedOnStyles = Vale, write-good, proselint

# The vocabulary exists only to quiet Vale.Spelling; we don't want its other
# effect of enforcing each term's exact casing across the docs.
Vale.Terms = NO

# Disabled rules — these misfire on dense, normative spec/research prose:
#   E-Prime  bans every "is/are", but definitions ("A Source *is* …") need it.
#   TooWordy flags precise domain verbs (e.g. the "Evaluate" workflow, "modify",
#            "equivalent") as bloat; near-zero true positives here.
# Kept: write-good.Passive (advisory nudge) and write-good.Weasel (genuinely useful).
write-good.E-Prime = NO
write-good.TooWordy = NO
