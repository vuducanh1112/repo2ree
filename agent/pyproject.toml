[project]
name = "repo2ree-agent"
version = "0.1.0"
dependencies = [
    "anyio~=4.12",
    "repo2ree-protocol",
    "websockets~=15.0",
]

[tool.uv.sources]
repo2ree-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_agent"]
