[project]
name = "repo2ree-history"
version = "0.1.0"
description = "Typed application histories for repo2ree observation and verification."
requires-python = "~=3.13.0"
dependencies = ["pydantic~=2.11.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_history"]


[tool.coverage.run]
branch = true
source = ["repo2ree_history"]
data_file = "${REPO2REE_ASSURANCE_DIR-dist/assurance}/coverage/data/.coverage"

[tool.coverage.report]
show_missing = true

[tool.importlinter]
include_external_packages = true
root_packages = [
    "repo2ree_history", "repo2ree_api", "repo2ree_core", "repo2ree_docker",
    "repo2ree_executor", "repo2ree_provider_docker", "repo2ree_protocol",
    "repo2ree_supervisor", "repo2ree_workbench",
]


[[tool.importlinter.contracts]]
name = "History stays independent of runtime packages"
type = "forbidden"
source_modules = ["repo2ree_history"]
forbidden_modules = [
    "repo2ree_api", "repo2ree_core", "repo2ree_docker", "repo2ree_executor",
    "repo2ree_provider_docker", "repo2ree_protocol", "repo2ree_supervisor", "repo2ree_workbench",
]


[[tool.importlinter.contracts]]
name = "History core cannot reach the imperative shell"
type = "forbidden"
source_modules = ["repo2ree_history.core"]
forbidden_modules = ["repo2ree_history.shell"]

[[tool.importlinter.contracts]]
name = "History core has no I/O dependencies"
type = "forbidden"
source_modules = ["repo2ree_history.core"]
forbidden_modules = ["os", "sys", "pathlib", "subprocess", "socket", "http", "urllib", "tempfile", "shutil", "io", "random", "uuid", "time"]
allow_indirect_imports = true
