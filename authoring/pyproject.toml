[project]
name = "repo2ree-authoring"
version = "0.1.0"
dependencies = [
    "repo2ree-protocol",
    "repo2ree-ree",
    "pydantic~=2.11.7",
]

[tool.uv.sources]
repo2ree-protocol = { workspace = true }
repo2ree-ree = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_authoring"]
