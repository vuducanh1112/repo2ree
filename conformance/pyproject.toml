[project]
name = "repo2ree-conformance"
version = "0.1.0"
description = "Check repo2ree behaviour evidence against the declared behaviour specification."
requires-python = "~=3.13.0"
dependencies = ["pydantic~=2.11.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2ree_conformance"]


[tool.importlinter]
include_external_packages = true
root_packages = [
    "repo2ree_conformance", "repo2ree_api", "repo2ree_core", "repo2ree_docker",
    "repo2ree_executor", "repo2ree_provider_docker", "repo2ree_protocol",
    "repo2ree_supervisor", "repo2ree_workbench",
]

# The checker is the oracle for code it must not share fate with: it reads the
# specification and evidence files, never the implementation that produced them.
[[tool.importlinter.contracts]]
name = "Conformance stays independent of runtime packages"
type = "forbidden"
source_modules = ["repo2ree_conformance"]
forbidden_modules = [
    "repo2ree_api", "repo2ree_core", "repo2ree_docker", "repo2ree_executor",
    "repo2ree_provider_docker", "repo2ree_protocol", "repo2ree_supervisor", "repo2ree_workbench",
]

# Rules are pure: the same specification and evidence always give the same verdicts.
[[tool.importlinter.contracts]]
name = "Conformance rules have no I/O dependencies"
type = "forbidden"
source_modules = [
    "repo2ree_conformance.spec",
    "repo2ree_conformance.evidence",
    "repo2ree_conformance.check",
    "repo2ree_conformance.codegen",
    "repo2ree_conformance.report",
    "repo2ree_conformance.views",
    "repo2ree_conformance.html",
]
forbidden_modules = ["os", "sys", "subprocess", "socket", "http", "urllib", "tempfile", "shutil", "random", "uuid", "time"]
allow_indirect_imports = true
