# Every tree a checkout generates and git ignores, who writes it, and how it stays bounded.
#
# Each owner keeps what it writes bounded itself, best as it writes: every run rewrites it, or the
# producer drops the oldest when it adds. Only an owner with output no write of its own bounds names
# a `prune` command (which takes --dry-run). `just prune` runs those commands,
# then lists whatever lies under a root that no entry claims: output that nothing writes any
# more, from a renamed or retired producer, which no owner will ever clean. A new generated tree
# needs an entry here, or `just prune` reports it as unclaimed.
#
# A claim covers its path and everything under it. Files git tracks under a root (a directory's
# own .gitignore) are never unclaimed.

roots = ["test-artifacts", "reports", "logs", "dist", "sites", ".receipts"]
# Names that are no one's output: never reported, never removed.
ignore = [".DS_Store"]

[owners.testbed]
summary = "Per-test e2e runs (with the MP4s `just render-cli-sessions` renders beside a run's terminal recordings), suite recordings, stack state, test case recordings and sessions, and the runs exercises are replayed in"
retention = "The newest runs per tier, problems, and the receipt's; a month for recordings and sessions; each exercise case's newest replay, which the overview shows, and exercise runs of the last six hours"
prune = ["python", "-m", "repo2ree_testbed", "prune"]
claims = [
  "test-artifacts/e2e",
  "test-artifacts/recordings",
  "test-artifacts/archives",
  "test-artifacts/telemetry",
  "test-artifacts/state",
  "test-artifacts/python/tests",
  "test-artifacts/python/sessions",
  "test-artifacts/assurance/tests",
  "test-artifacts/assurance/sessions",
  "test-artifacts/exercises",
]

[owners.testbed-rewritten]
summary = "Coverage, service logs, fixtures, and a machine job's state"
retention = "Rewritten by each run"
claims = [
  "test-artifacts/python/coverage",
  "test-artifacts/python/services",
  "test-artifacts/fixtures",
  "test-artifacts/machine-job",
]

[owners.example-bundle]
summary = "The example REE as `just author-example-bundle` stages it, before it is checked and adopted"
retention = "Rewritten by each staging"
claims = ["test-artifacts/example-bundle"]

[owners.demo-api]
summary = "The API walkthrough's terminal recording and its transcript (`just demo-api`)"
retention = "Rewritten by each recording"
claims = ["test-artifacts/python/attachments"]

[owners.sigstore-smoke]
summary = "The Sigstore `just sigstore-smoke` starts: its configuration, keys, log, and the bundle it signs"
retention = "Rewritten by each smoke run"
claims = ["test-artifacts/sigstore-smoke"]

[owners.cli-sessions]
summary = "The CLI showcases' terminal sessions as videos, one per test, each with its key and the commit that rendered it"
retention = "A video per test of the runs rendered; a run's go when its run does, and a test's when its run no longer has it"
claims = ["reports/sessions"]

[owners.core-container-runner]
summary = "Scratch the container runner's integration tests share with the engine, under the checkout a dev container mounts"
retention = "Each test removes its own folder; only the empty parent stays"
claims = ["test-artifacts/core-container-runner"]

[owners.hypothesis]
summary = "Hypothesis' example database, pinned to the repository (conftest.py)"
retention = "Unbounded but slow: it keeps the examples that once failed; removing it loses only those"
claims = ["test-artifacts/cache"]

[owners.assess-behaviour]
summary = "Behaviour assessments and their visualizations, beside the runs and dossiers they report on"
retention = "Rewritten per run or dossier; a run's report goes when its run does, by every assessment"
claims = ["reports/behaviour"]

[owners.gui]
summary = "Vitest coverage and Playwright output"
retention = "Rewritten by each run; Playwright empties a project's folder before it runs"
claims = ["test-artifacts/node", "test-artifacts/browser"]

[owners.overview]
summary = "Repository overviews, one per commit"
retention = "The newest three, and the one `latest` points to, kept by every build"
claims = ["reports/overview"]

[owners.repoview-rewritten]
summary = "Diagrams and metrics, stamped with the commit they came from, and the exports the overview reads"
retention = "Rewritten by each run"
claims = ["reports/diagrams", "reports/metrics", "reports/exports"]

[owners.just-timing]
summary = "How long each recipe of every `just` run took"
retention = "Thirty days, kept by every recorded run"
claims = ["logs/just"]

[owners.builds]
summary = "Images, bundles, the testbed's machine images and their tags, presentations, and the documentation site"
retention = "Rewritten by each build"
claims = ["dist/images", "dist/bundles", "dist/environments", "dist/presentations", "sites/docs"]

[owners.gates]
summary = "Receipts: what a gate proved, bound to the content it proved it on"
retention = "Rewritten by each gate"
claims = [
  ".receipts/commit-gate.json",
  ".receipts/assurance-gate.json",
  ".receipts/publish-gate.json",
  ".receipts/image-candidates",
]

[owners.tier-receipts]
summary = "Tier receipts (scripts/gates/tiers.py): a gated tier's run, per tree and platform, that publish-gate requires"
retention = "Kept per tree, so a branch checked out again still finds its own; a few kilobytes each"
claims = [".receipts/tiers"]
